---
# Docmost IngressRoute with Authentik Forward Auth
# Forward-auth pattern: Authentik SSO gate before accessing Docmost UI
# API paths bypass forward-auth (Docmost handles its own JWT authentication)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docmost
  namespace: docmost
  annotations:
    external-dns.alpha.kubernetes.io/hostname: docs.example.com
    external-dns.alpha.kubernetes.io/target: <internal-ip>
spec:
  entryPoints:
    - websecure
  routes:
    # API routes: Docmost handles auth via JWT cookies (no forward-auth)
    - match: Host(`docs.example.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: docmost
          namespace: docmost
          port: 3000
      middlewares:
        - name: security-headers
          namespace: traefik
    # UI routes: protected by Authentik forward-auth SSO
    - match: Host(`docs.example.com`)
      kind: Rule
      priority: 50
      services:
        - name: docmost
          namespace: docmost
          port: 3000
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
        - name: security-headers
          namespace: traefik
  tls:
    secretName: wildcard-tls
