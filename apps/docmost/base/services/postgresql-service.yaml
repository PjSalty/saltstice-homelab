---
apiVersion: v1
kind: Service
metadata:
  name: docmost-postgresql
  namespace: docmost
  labels:
    app: docmost-postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
    - port: 9187
      targetPort: 9187
      protocol: TCP
      name: pg-metrics
  selector:
    app: docmost-postgresql
