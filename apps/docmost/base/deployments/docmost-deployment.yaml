---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost
  namespace: docmost
  labels:
    app.kubernetes.io/name: docmost
spec:
  # replicas managed by HPA (autoscaling/hpa.yaml)
  selector:
    matchLabels:
      app.kubernetes.io/name: docmost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docmost
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docmost
          image: ${IMAGE_DOCMOST}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Docmost writes to local storage
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: APP_URL
              value: "https://docs.${DOMAIN}"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: app-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://docmost-redis:6379"
            - name: STORAGE_DRIVER
              value: "local"
            - name: PORT
              value: "3000"
            - name: DISABLE_TELEMETRY
              value: "true"
          volumeMounts:
            - name: docmost-data
              mountPath: /app/data/storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: docmost-data
          persistentVolumeClaim:
            claimName: docmost-data
