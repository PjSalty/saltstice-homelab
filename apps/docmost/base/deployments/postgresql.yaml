---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost-postgresql
  namespace: docmost
  labels:
    app: docmost-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docmost-postgresql
  template:
    metadata:
      labels:
        app: docmost-postgresql
      annotations:
        backup.velero.io/backup-volumes-excludes: postgres-data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: ${IMAGE_POSTGRES_16}
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data || true"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: postgres
          image: ${IMAGE_POSTGRES_16}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "docmost"
            - name: POSTGRES_USER
              value: "docmost"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: postgres-password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - docmost
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - docmost
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: postgres-exporter
          image: ${IMAGE_POSTGRES_EXPORTER}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9187
              name: pg-metrics
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/docmost?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "docmost"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: docmost-postgresql
