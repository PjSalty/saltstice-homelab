# Dedicated ServiceAccount for Authentik server/worker so the embedded
# outpost controller can create/reconcile its Deployment + Service +
# ConfigMap + Secret resources in this namespace. Without this, the
# worker falls back to a tokenless default SA and outpost auto-deploy
# fails with "Service token file does not exist", leaving every proxy-
# provider (forward-auth) protected FQDN returning 503.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/managed-by: flux
---
# Scope the permissions tightly to the authentik namespace — the
# embedded outpost only manages objects here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-outpost-controller
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["middlewares", "ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-outpost-controller
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-outpost-controller
subjects:
  - kind: ServiceAccount
    name: authentik
    namespace: authentik
