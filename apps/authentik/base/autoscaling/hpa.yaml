---
# HPA for authentik-server: scales replicas based on CPU utilization
# Worker, PostgreSQL, and Redis are not horizontally scalable
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: authentik-server
  namespace: authentik
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authentik-server
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
