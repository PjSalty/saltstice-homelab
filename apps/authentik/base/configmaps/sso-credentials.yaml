---
# SSO Credentials ConfigMap
# Contains OIDC client IDs and secrets for all applications
# Apps can mount this ConfigMap to configure SSO
apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-credentials
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: sso-config
data:
  # Authentik URLs
  AUTHENTIK_URL: "https://auth.example.com"
  OIDC_ISSUER: "https://auth.example.com/application/o"
  OIDC_AUTH_URL: "https://auth.example.com/application/o/authorize/"
  OIDC_TOKEN_URL: "https://auth.example.com/application/o/token/"
  OIDC_USERINFO_URL: "https://auth.example.com/application/o/userinfo/"

  # Jellyfin
  JELLYFIN_CLIENT_ID: "jellyfin-sso"
  JELLYFIN_REDIRECT_URI: "https://jellyfin.example.com/sso/OID/redirect/authentik"

  # Homarr
  HOMARR_CLIENT_ID: "homarr-sso"
  HOMARR_REDIRECT_URI: "https://home.example.com/api/auth/callback/oidc"

  # Semaphore
  SEMAPHORE_CLIENT_ID: "semaphore-sso"
  SEMAPHORE_REDIRECT_URI: "https://semaphore.example.com/api/auth/oidc/authentik/redirect"

  # Vaultwarden
  VAULTWARDEN_CLIENT_ID: "vaultwarden-sso"
  VAULTWARDEN_REDIRECT_URI: "https://vault.example.com/identity/connect/oidc-signin"

  # Headlamp
  HEADLAMP_CLIENT_ID: "headlamp-sso"
  HEADLAMP_REDIRECT_URI: "https://k8s.example.com/oidc-callback"

  # NetBox
  NETBOX_CLIENT_ID: "netbox-sso"
  NETBOX_REDIRECT_URI: "https://netbox.example.com/oauth/complete/oidc/"

  # GitLab
  GITLAB_CLIENT_ID: "gitlab-sso"
  GITLAB_REDIRECT_URI: "https://gitlab.example.com/users/auth/openid_connect/callback"

  # Harbor
  HARBOR_CLIENT_ID: "harbor-sso"
  HARBOR_REDIRECT_URI: "https://harbor.example.com/c/oidc/callback"

  # Proxmox
  PROXMOX_CLIENT_ID: "proxmox-sso"
  PROXMOX_ISSUER_URL: "https://auth.example.com/application/o/proxmox/"

  # Grafana
  GRAFANA_CLIENT_ID: "grafana-sso"
  GRAFANA_REDIRECT_URI: "https://grafana.example.com/login/generic_oauth"

  # AdGuard Home
  ADGUARD_CLIENT_ID: "adguard-sso"
  ADGUARD_REDIRECT_URI: "https://adguard.example.com/callback"

  # TrueNAS
  TRUENAS_CLIENT_ID: "truenas-sso"
  TRUENAS_REDIRECT_URI: "https://truenas.example.com/oauth/callback"

  # AMP Game Server
  AMP_CLIENT_ID: "amp-sso"
  AMP_REDIRECT_URI: "https://amp.example.com/"

  # Docmost (forward-auth, no native OIDC in community edition)
  DOCMOST_CLIENT_ID: "docmost-sso"
  DOCMOST_REDIRECT_URI: ""

# NOTE: SSO client secrets are stored in a separate SOPS-encrypted file:
# kubernetes/apps/authentik/base/secrets/sso-client-secrets.yaml
