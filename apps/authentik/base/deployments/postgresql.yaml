---
# Dedicated PV for Authentik PostgreSQL data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-postgresql-pv
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  nfs:
    server: ${NFS_SERVER}
    path: /mnt/tank/kubernetes/authentik-authentik-postgresql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  volumeName: authentik-postgresql-pv
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  namespace: authentik
  labels:
    app: authentik-postgresql
spec:
  serviceName: authentik-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgresql
  template:
    metadata:
      labels:
        app: authentik-postgresql
      annotations:
        backup.velero.io/backup-volumes-excludes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fix-permissions
        image: ${IMAGE_POSTGRES_16}
        command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data || true"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: postgresql
        image: ${IMAGE_POSTGRES_16}
        securityContext:
          allowPrivilegeEscalation: false
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: authentik
        - name: POSTGRES_USER
          value: authentik
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_POSTGRESQL__PASSWORD
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "scram-sha-256"
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        ports:
        - containerPort: 5432
          name: postgresql
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  sleep 5
                  if ! grep -q "<internal-ip>/8" /var/lib/postgresql/data/pg_hba.conf 2>/dev/null; then
                    echo "host    all             all             <internal-ip>/8              scram-sha-256" >> /var/lib/postgresql/data/pg_hba.conf
                    pg_ctl reload -D /var/lib/postgresql/data 2>/dev/null || true
                  fi
                  # Sync password from secret to database (handles credential rotation)
                  until pg_isready -U authentik -q; do sleep 1; done
                  psql -U authentik -d authentik -c "ALTER USER authentik WITH PASSWORD '$${POSTGRES_PASSWORD}';" 2>/dev/null || true
                  # Performance tuning for Authentik's polymorphic Django ORM queries
                  # work_mem: 16MB handles complex JOINs across 10+ source type tables
                  # random_page_cost: 1.1 correct for SSD/iSCSI (default 4 is for spinning disk)
                  # jit: off prevents JIT overhead on short-lived queries
                  psql -U authentik -d authentik -c "ALTER SYSTEM SET work_mem = '16MB';" 2>/dev/null || true
                  psql -U authentik -d authentik -c "ALTER SYSTEM SET random_page_cost = 1.1;" 2>/dev/null || true
                  psql -U authentik -d authentik -c "ALTER SYSTEM SET jit = off;" 2>/dev/null || true
                  pg_ctl reload -D /var/lib/postgresql/data 2>/dev/null || true
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: postgres-exporter
        image: ${IMAGE_POSTGRES_EXPORTER}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - containerPort: 9187
            name: pg-metrics
        env:
          - name: DATA_SOURCE_URI
            value: "localhost:5432/authentik?sslmode=disable"
          - name: DATA_SOURCE_USER
            value: "authentik"
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
                name: authentik-secret
                key: AUTHENTIK_POSTGRESQL__PASSWORD
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: authentik-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql
  namespace: authentik
  labels:
    app: authentik-postgresql
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  - port: 9187
    targetPort: 9187
    protocol: TCP
    name: pg-metrics
  selector:
    app: authentik-postgresql
