---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
---
# Bind headlamp SA to restricted read-only role
# User operations use OIDC identity for authorization
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-dashboard
  labels:
    app: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-dashboard  # Restricted read-only role, NOT cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp
  namespace: headlamp
