---
# VPA for seaweedfs (Auto mode - applies recommendations)
# All-in-one mode: master + volume + filer + S3 in single container
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: seaweedfs
  namespace: storage
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seaweedfs
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: seaweedfs
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
