---
# SeaweedFS ServiceMonitor for Prometheus
# Scrapes metrics from SeaweedFS for monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seaweedfs
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    release: monitoring  # Required for Prometheus to discover
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
  namespaceSelector:
    matchNames:
      - storage
