---
# SeaweedFS S3 Service - Primary service for S3 API
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: s3
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
---
# SeaweedFS Filer Service - Web UI and file operations
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: filer
spec:
  type: ClusterIP
  ports:
    - name: filer
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
---
# SeaweedFS Master Service - Cluster management
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: master
spec:
  type: ClusterIP
  ports:
    - name: master
      port: 9333
      targetPort: 9333
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
---
# SeaweedFS Metrics Service - Prometheus scraping
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-metrics
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9327
      targetPort: 9327
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
