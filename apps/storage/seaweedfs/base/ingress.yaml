---
# SeaweedFS S3 API Ingress
# Provides external S3-compatible endpoint for backups, etc.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs-s3
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
  annotations:
    external-dns.alpha.kubernetes.io/hostname: s3.${DOMAIN}
    external-dns.alpha.kubernetes.io/target: "${TRAEFIK_LB_IP}"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3.${DOMAIN}`)
      kind: Rule
      services:
        - name: seaweedfs-s3
          port: 8333
  tls:
    secretName: wildcard-tls
---
# SeaweedFS Filer UI Ingress
# Provides web interface for file management
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs-filer
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
  annotations:
    external-dns.alpha.kubernetes.io/hostname: seaweedfs.${DOMAIN}
    external-dns.alpha.kubernetes.io/target: "${TRAEFIK_LB_IP}"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seaweedfs.${DOMAIN}`)
      kind: Rule
      services:
        - name: seaweedfs-filer
          port: 8888
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
        - name: security-headers
          namespace: traefik
  tls:
    secretName: wildcard-tls
