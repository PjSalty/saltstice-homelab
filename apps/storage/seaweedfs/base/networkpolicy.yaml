---
# CiliumNetworkPolicy for SeaweedFS
# Allows ingress from:
#   - Traefik (external access)
#   - GitLab Runner (S3 cache)
#   - Any namespace (internal S3 access)
#   - Prometheus (metrics scraping)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seaweedfs
  namespace: storage
spec:
  endpointSelector: {}
  ingress:
    # Allow S3 API from all cluster pods (gitlab-runner, etcd backups, etc.)
    # Note: fromEntities "cluster" is required for cross-namespace access.
    # fromEndpoints [{}] in namespace-scoped CiliumNetworkPolicy only matches
    # endpoints in the same namespace (Cilium 1.18 behavior).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    # Allow Filer access from all cluster pods (Traefik ingress proxy, etc.)
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    # Allow metrics scraping from monitoring namespace
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9327"
              protocol: TCP
    # Allow master port for internal cluster operations and bucket-init
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
        - matchLabels:
            app.kubernetes.io/name: seaweedfs-bucket-init
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage
      toPorts:
        - ports:
            - port: "9333"
              protocol: TCP
            - port: "8080"
              protocol: TCP
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    # Allow intra-namespace (master ↔ volume ↔ filer ↔ bucket-init)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage
      toPorts:
        - ports:
            - port: "9333"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8333"
              protocol: TCP
            - port: "8888"
              protocol: TCP
    # Allow NFS to TrueNAS
    - toCIDR:
        - <vlan-cidr>  # Storage VLAN
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
            - port: "111"
              protocol: TCP
