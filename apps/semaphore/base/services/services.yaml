---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: semaphore
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  - port: 9187
    targetPort: 9187
    name: pg-metrics

---
apiVersion: v1
kind: Service
metadata:
  name: semaphore
  namespace: semaphore
spec:
  selector:
    app: semaphore
  ports:
  - port: 3000
    targetPort: 3000
