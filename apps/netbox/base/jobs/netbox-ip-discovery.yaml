---
# NetBox IP Discovery CronJob
# Scans network, queries DNS, and auto-populates NetBox with discovered devices
# Runs every 15 minutes to keep NetBox in sync with reality
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-ip-discovery
  namespace: netbox
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: netbox-automation
          restartPolicy: OnFailure
          containers:
          - name: ip-discovery
            image: ${IMAGE_PYTHON_SLIM}
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -ex

              echo "=========================================="
              echo "NetBox IP Discovery - $(date)"
              echo "=========================================="

              # Install dependencies
              echo "Installing dependencies..."
              apt-get update -qq && apt-get install -y -qq nmap dnsutils curl
              pip install --no-cache-dir pynetbox==7.4.1 requests==2.32.3
              echo "Dependencies installed successfully"

              # Run discovery script
              echo "Starting network discovery..."
              python3 -u /scripts/discover-and-sync.py

              echo "=========================================="
              echo "Discovery completed - $(date)"
              echo "=========================================="
              
            env:
            - name: NETBOX_API
              value: "http://netbox"
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netbox-automation-token
                  key: token
            - name: NETWORK_RANGE
              value: "<mgmt-ip>/24"
            - name: DNS_SERVERS
              value: "<mgmt-ip>,1.1.1.1"
            - name: GITLAB_API
              value: "https://gitlab.example.com/api/v4"
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-automation-token
                  key: token
            - name: GITLAB_PROJECT_ID
              value: "infrastructure/homelab"
                  
            volumeMounts:
            - name: discovery-script
              mountPath: /scripts
              
          volumes:
          - name: discovery-script
            configMap:
              name: netbox-discovery-script
              defaultMode: 0755
---
# Service Account for NetBox automation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbox-automation
  namespace: netbox
---
# Role for NetBox automation (if needed to access K8s resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbox-automation
  namespace: netbox
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbox-automation
  namespace: netbox
subjects:
- kind: ServiceAccount
  name: netbox-automation
  namespace: netbox
roleRef:
  kind: Role
  name: netbox-automation
  apiGroup: rbac.authorization.k8s.io
