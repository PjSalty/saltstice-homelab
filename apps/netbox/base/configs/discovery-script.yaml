---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-discovery-script
  namespace: netbox
data:
  discover-and-sync.py: |
    #!/usr/bin/env python3
    """NetBox IP Discovery - Scans network, queries DNS, auto-populates NetBox"""
    import os, sys, subprocess, socket, json
    from datetime import datetime
    import pynetbox, requests
    
    NETBOX_API = os.getenv("NETBOX_API", "http://netbox")
    NETBOX_TOKEN = os.getenv("NETBOX_TOKEN")
    NETWORK_RANGE = os.getenv("NETWORK_RANGE", "<mgmt-ip>/24")
    
    def log(msg):
        print(f"[{datetime.now().isoformat()}] {msg}")
    
    def scan_network(range):
        """Scan for active IPs"""
        log(f"Scanning: {range}")
        result = subprocess.run(["nmap", "-sn", "-oG", "-", range], 
                              capture_output=True, text=True, timeout=300)
        ips = [line.split()[1] for line in result.stdout.split("\n") 
               if "Status: Up" in line and line.split()[1] != "0.0.0.0"]
        log(f" Found {len(ips)} active IPs")
        return ips
    
    def resolve_hostname(ip):
        """DNS lookup"""
        try:
            return socket.gethostbyaddr(ip)[0]
        except:
            return None
    
    def sync_to_netbox(nb, devices):
        """Add discovered devices to NetBox"""
        site = nb.dcim.sites.get(slug="homelab") or nb.dcim.sites.create(name="Homelab", slug="homelab")
        role = nb.dcim.device_roles.get(slug="discovered") or nb.dcim.device_roles.create(
            name="Discovered", slug="discovered", color="9e9e9e", vm_role=True)
        
        changes = False
        for ip, hostname in devices.items():
            existing = nb.ipam.ip_addresses.get(address=f"{ip}/24")
            if not existing:
                vm_name = hostname.split(".")[0] if hostname else f"device-{ip.replace('.', '-')}"
                vm = nb.virtualization.virtual_machines.get(name=vm_name) or \
                     nb.virtualization.virtual_machines.create(name=vm_name, site=site.id, role=role.id, status="active")
                nb.ipam.ip_addresses.create(address=f"{ip}/24", status="active", 
                                           dns_name=hostname or vm_name,
                                           description=f"Discovered {datetime.now().date()}")
                log(f" Added: {ip}  {hostname or vm_name}")
                changes = True
        return changes
    
    def main():
        log("=== NetBox IP Discovery ===")
        nb = pynetbox.api(NETBOX_API, token=NETBOX_TOKEN)
        nb.http_session.verify = False
        
        ips = scan_network(NETWORK_RANGE)
        devices = {ip: resolve_hostname(ip) for ip in ips}
        
        if sync_to_netbox(nb, devices):
            log(f" Synced {len(devices)} devices to NetBox")
        else:
            log("No new devices")
    
    if __name__ == "__main__":
        main()
