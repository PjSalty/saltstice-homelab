# ============================================================================
# WARNING: DO NOT USE - NetBox runs as a VM, NOT in Kubernetes!
# ============================================================================
# NetBox is deployed on VM <internal-ip> (netbox.example.com)
# Plugin config location on VM: /data/netbox/config/extra.py
# Use: ansible/playbooks/28-netbox-install-dns-plugin.yml
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-extra-config
  namespace: netbox
data:
  extra.py: |
    # NetBox Plugin Configuration
    # netbox-plugin-dns v1.4.4 - DNS record management
    # Researched: 2025-12-03
    # Source: https://github.com/peteeckel/netbox-plugin-dns
    PLUGINS = ['netbox_dns']
    PLUGINS_CONFIG = {
        'netbox_dns': {
            # Enable zone management features
            'zone_default_ttl': 86400,  # 1 day default TTL
            'zone_soa_minimum': 3600,   # 1 hour SOA minimum
            # Feature toggles
            'feature_ipam_coupling': True,  # Link DNS records to IPAM
            'feature_dns_views': True,      # Enable DNS views support
        },
    }

    # OIDC/OAuth2 Configuration for Authentik
    import os

    # Remote authentication permissions
    REMOTE_AUTH_DEFAULT_PERMISSIONS = {}

    # Python Social Auth OIDC Configuration
    # These settings MUST be explicitly defined here, not just as environment variables
    SOCIAL_AUTH_OIDC_OIDC_ENDPOINT = os.getenv('SOCIAL_AUTH_OIDC_OIDC_ENDPOINT', 'https://auth.example.com/application/o/netbox/')
    SOCIAL_AUTH_OIDC_KEY = os.getenv('SOCIAL_AUTH_OIDC_KEY', 'netbox-sso')
    SOCIAL_AUTH_OIDC_SECRET = os.getenv('SOCIAL_AUTH_OIDC_SECRET', 'netbox-SaltSSO2025-secret')

    # OIDC scopes
    SOCIAL_AUTH_OIDC_SCOPE = ['openid', 'profile', 'email']

    # Additional OIDC settings
    SOCIAL_AUTH_JSONFIELD_ENABLED = True
    SOCIAL_AUTH_TRAILING_SLASH = False
    SOCIAL_AUTH_LOGIN_REDIRECT_URL = '/'
    SOCIAL_AUTH_SANITIZE_REDIRECTS = True
    SOCIAL_AUTH_USERNAME_IS_FULL_EMAIL = False

    # OIDC ID token verification
    SOCIAL_AUTH_OIDC_ID_TOKEN_DECRYPTION_KEY = SOCIAL_AUTH_OIDC_SECRET

    # Disable SSL certificate verification for self-signed/internal CA certificates
    # This is required when Authentik uses a certificate from an internal CA
    SOCIAL_AUTH_VERIFY_SSL = False

    # Alternative: Provide CA certificate path
    # SOCIAL_AUTH_REQUESTS_CA_BUNDLE = '/path/to/ca-bundle.crt'

    # User model field mapping
    SOCIAL_AUTH_USER_FIELDS = ['username', 'email']

    # Automatically create users on first login
    SOCIAL_AUTH_CREATE_USERS = True

    # Pipeline to create users
    SOCIAL_AUTH_PIPELINE = (
        'social_core.pipeline.social_auth.social_details',
        'social_core.pipeline.social_auth.social_uid',
        'social_core.pipeline.social_auth.social_user',
        'social_core.pipeline.user.get_username',
        'social_core.pipeline.user.create_user',
        'social_core.pipeline.social_auth.associate_user',
        'social_core.pipeline.social_auth.load_extra_data',
        'social_core.pipeline.user.user_details',
    )
