---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vpn
resources:
  - namespace.yaml
  - service.yaml
  - ingressroute.yaml
# Note: Using labels instead of commonLabels to avoid adding selectors
# to the external service (which uses manual Endpoints)
labels:
  - pairs:
      app.kubernetes.io/part-of: vpn
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
