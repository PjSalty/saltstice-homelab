# Jellyfin Media Server
# Version: 10.11.6
# GPU: NVIDIA RTX A2000 on a single Kubernetes worker for hardware transcoding
# Storage: iSCSI for config/cache (block storage for SQLite performance)
apiVersion: apps/v1
kind: Deployment
metadata:
    name: jellyfin
    namespace: media
    labels:
        app: jellyfin
spec:
    replicas: 1
    strategy:
        # Important for GPU and PVC
        type: Recreate
    selector:
        matchLabels:
            app: jellyfin
    template:
        metadata:
            labels:
                app: jellyfin
        spec:
            # Use NVIDIA container runtime for GPU access
            runtimeClassName: nvidia
            # Schedule on GPU-enabled node
            nodeSelector:
                nvidia.com/gpu.present: "true"
            automountServiceAccountToken: false
            # Security context for media file access
            securityContext:
                fsGroup: 44
                fsGroupChangePolicy: OnRootMismatch
                supplementalGroups:
                    - 44
                    - 109
                seccompProfile:
                    type: RuntimeDefault
            initContainers:
                # Init container to install SSO plugin and config — runs every pod start.
                # Plugin XML is templated to keep AdminRoles current with whatever
                # Authentik group ("jellyfin-admins") owns admin in the OIDC token.
                - name: install-sso-plugin
                  image: ${IMAGE_ALPINE}
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -e
                      PLUGIN_DIR="/config/plugins/SSO-Auth"
                      CONFIG_DIR="/config/plugins/configurations"

                      apk add --no-cache curl unzip

                      if [ -f "$PLUGIN_DIR/SSO-Auth.dll" ]; then
                        echo "SSO plugin already installed"
                      else
                        echo "Downloading SSO plugin v4.0.0.3..."
                        mkdir -p "$PLUGIN_DIR"
                        curl -sL -o /tmp/sso.zip "https://github.com/9p4/jellyfin-plugin-sso/releases/download/v4.0.0.3/sso-authentication_4.0.0.3.zip"
                        unzip -o /tmp/sso.zip -d "$PLUGIN_DIR"
                        rm /tmp/sso.zip
                      fi

                      mkdir -p "$CONFIG_DIR"
                      cat > "$CONFIG_DIR/Jellyfin.Plugin.SSO-Auth.xml" << SSOEOF
                      <?xml version="1.0" encoding="utf-8"?>
                      <PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
                        <SamlConfigs />
                        <OidConfigs>
                          <item>
                            <key><string>authentik</string></key>
                            <value>
                              <OidEndpoint>https://auth.example.com/application/o/jellyfin/</OidEndpoint>
                              <OidClientId>jellyfin-sso</OidClientId>
                              <OidSecret>${OIDC_CLIENT_SECRET}</OidSecret>
                              <Enabled>true</Enabled>
                              <EnableAuthorization>true</EnableAuthorization>
                              <EnableAllFolders>true</EnableAllFolders>
                              <RoleClaim>groups</RoleClaim>
                              <AdminRoles><string>jellyfin-admins</string></AdminRoles>
                              <OidScopes><string>openid</string><string>profile</string><string>email</string><string>groups</string></OidScopes>
                              <DefaultProvider>Jellyfin.Server.Implementations.Users.DefaultAuthenticationProvider</DefaultProvider>
                              <DisablePushedAuthorization>true</DisablePushedAuthorization>
                              <SchemeOverride>https</SchemeOverride>
                            </value>
                          </item>
                        </OidConfigs>
                      </PluginConfiguration>
                      SSOEOF
                  env:
                    - name: OIDC_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: sso-client-secrets
                          key: JELLYFIN_CLIENT_SECRET
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
                  volumeMounts:
                    - name: config
                      mountPath: /config
            containers:
                - name: jellyfin
                  image: ${IMAGE_JELLYFIN}
                  imagePullPolicy: IfNotPresent
                  ports:
                    - name: http
                      containerPort: 8096
                      protocol: TCP
                    - name: discovery
                      containerPort: 7359
                      protocol: UDP
                  env:
                    - name: TZ
                      value: America/New_York
                    # Must be publicly-resolvable. LAN clients auto-switch to
                    # LocalAddress; Firestick/iOS otherwise fail with "no server found".
                    - name: JELLYFIN_PublishedServerUrl
                      value: https://jellyfin.example.com
                    # NVIDIA GPU configuration for hardware transcoding
                    - name: NVIDIA_VISIBLE_DEVICES
                      value: "all"
                    - name: NVIDIA_DRIVER_CAPABILITIES
                      value: "all"
                    # .NET file locking: disable to prevent NFS/iSCSI lock conflicts
                    - name: DOTNET_SYSTEM_IO_DISABLEFILELOCKING
                      value: "true"
                    - name: JELLYFIN_SSO_PROVIDER
                      value: Authentik
                    - name: JELLYFIN_SSO_CLIENT_ID
                      value: jellyfin-sso
                    - name: JELLYFIN_SSO_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: jellyfin-admin-credentials
                          key: OIDC_CLIENT_SECRET
                    - name: JELLYFIN_SSO_AUTHORITY
                      # Endpoint uses app slug; client_id is separate
                      value: https://auth.example.com/application/o/jellyfin/
                    - name: JELLYFIN_SSO_REDIRECT_URI
                      value: https://jellyfin.example.com/sso/OID/redirect/authentik
                  volumeMounts:
                    - name: config
                      mountPath: /config
                    - name: cache
                      mountPath: /cache
                    - name: transcodes
                      mountPath: /cache/transcodes
                    - name: media
                      mountPath: /media
                      readOnly: true
                  resources:
                    requests:
                        cpu: 500m
                        memory: 1Gi
                        nvidia.com/gpu: "1"
                    limits:
                        cpu: 4000m
                        memory: 4Gi
                        nvidia.com/gpu: "1"
                  livenessProbe:
                    httpGet:
                        path: /health
                        port: http
                    initialDelaySeconds: 120
                    periodSeconds: 60
                    timeoutSeconds: 60
                    failureThreshold: 5
                  readinessProbe:
                    httpGet:
                        path: /health
                        port: http
                    initialDelaySeconds: 30
                    periodSeconds: 60
                    timeoutSeconds: 60
                    failureThreshold: 5
            volumes:
                # Config: iSCSI block storage for SQLite database performance
                - name: config
                  persistentVolumeClaim:
                    claimName: jellyfin-config-iscsi
                # Cache: persistent iSCSI (artwork survives restarts)
                - name: cache
                  persistentVolumeClaim:
                    claimName: jellyfin-cache-persistent
                # Transcodes: RAM-backed tmpfs for fastest transcode I/O
                - name: transcodes
                  emptyDir:
                    medium: Memory
                    sizeLimit: 8Gi
                # Media: NFS read-only via the homelab NAS
                - name: media
                  persistentVolumeClaim:
                    claimName: jellyfin-media
                    readOnly: true
