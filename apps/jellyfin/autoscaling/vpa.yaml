---
# VPA Auto mode applies recommendations.
# GPU resource constraints are separate from CPU/memory — VPA never touches the GPU limit.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: jellyfin
  namespace: media
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jellyfin
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: jellyfin
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
      - containerName: install-sso-plugin
        mode: "Off"
---
# VPA for the media-drop-watcher (long-running classifier/mover sidecar Deployment)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: media-drop-watcher
  namespace: media
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-drop-watcher
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: watcher
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
