---
# Jellyfin Ingress - internal Traefik routing
#
# EXTERNAL ACCESS:
#   MikroTik NAT: WAN:<external-port> → Traefik VIP <internal-ip>:443
#   Public URL: https://jellyfin.example.com:<external-port>
#   Cloudflare DNS (grey-cloud, DNS-only) → WAN IP (managed by cloudflare-dns-sync)
#   Non-standard port avoids bot scanning and limits exposure to Jellyfin only.
#
# INTERNAL ACCESS:
#   https://jellyfin.example.com (via Traefik VIP <internal-ip>)
#   AdGuard DNS resolves to internal IP.
#
# SSO (Authentik) is INTERNAL ONLY - auth.example.com has no public
# DNS record. External users must use Jellyfin local credentials.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  labels:
    dns.example.com/public: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/hostname: jellyfin.example.com
    external-dns.alpha.kubernetes.io/target: "<internal-ip>"
    dns.example.com/public-hostname: "jellyfin.example.com"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jellyfin.example.com
    - jellyfin.example.com
    secretName: wildcard-tls
  rules:
  - host: jellyfin.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 8096
  - host: jellyfin.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 8096
