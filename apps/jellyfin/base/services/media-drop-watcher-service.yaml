---
# Service for media-drop-watcher Prometheus metrics endpoint
apiVersion: v1
kind: Service
metadata:
  name: media-drop-watcher
  namespace: media
  labels:
    app.kubernetes.io/name: media-drop-watcher
    app.kubernetes.io/component: automation
spec:
  selector:
    app.kubernetes.io/name: media-drop-watcher
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
