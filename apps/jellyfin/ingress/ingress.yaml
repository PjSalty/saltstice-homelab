---
# External access:
#   Router NAT: WAN:<external-port> → Traefik VIP:443
#   Public URL: https://jellyfin.example.com:<external-port>
#   Cloudflare DNS (DNS-only, grey-cloud) → WAN IP, kept current by a CronJob.
#   Non-standard port keeps incidental bot traffic off the front door.
#
# Internal access:
#   https://jellyfin.example.com (LAN-only, resolves via internal DNS to Traefik VIP).
#
# SSO (Authentik) is internal-only — auth.example.com has no public DNS record.
# External users sign in with Jellyfin's local accounts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  labels:
    dns.example.com/public: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/hostname: jellyfin.internal.example.com
    external-dns.alpha.kubernetes.io/target: "${TRAEFIK_LB_IP}"
    dns.example.com/public-hostname: "jellyfin.example.com"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.internal.example.com
        - jellyfin.example.com
      secretName: wildcard-tls
  rules:
    - host: jellyfin.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
    - host: jellyfin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
