# License Compliance CronJob
# Weekly scan of all cluster images for license compliance
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: license-compliance-scan
  namespace: security
spec:
  # Every Sunday at 4 AM (after Trivy vulnerability scans)
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: license-scanner
          restartPolicy: OnFailure
          initContainers:
            # Init container to list pod images (uses alpine + downloads kubectl)
            # Note: registry.k8s.io/kubectl is distroless (no shell), so we use alpine
            - name: get-images
              image: ${IMAGE_ALPINE}
              command:
                - /bin/sh
                - -c
                - |
                  # Install curl and download kubectl
                  apk add --no-cache curl >/dev/null 2>&1
                  curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
                  chmod +x kubectl

                  # Get all unique container images from running pods
                  ./kubectl get pods --all-namespaces -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' | sort -u > /shared/images.txt
                  echo "Found $(wc -l < /shared/images.txt) unique images"
                  cat /shared/images.txt
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: license-scanner
              image: ${IMAGE_TRIVY}
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "=== License Compliance Scan ==="
                  echo "Started: $(date -Iseconds)"
                  echo ""

                  VIOLATIONS=0
                  SCANNED=0

                  # Disallowed licenses (copyleft)
                  DISALLOWED="GPL-2.0 GPL-2.0-only GPL-2.0-or-later GPL-3.0 GPL-3.0-only GPL-3.0-or-later AGPL-3.0 AGPL-3.0-only AGPL-3.0-or-later"

                  echo "=== Scanning Images ==="
                  while read -r IMAGE; do
                    # Skip empty lines and infrastructure images
                    [ -z "$IMAGE" ] && continue
                    case "$IMAGE" in
                      *pause*|*kube-proxy*|*coredns*|*etcd*|*flannel*) continue ;;
                    esac

                    echo "Scanning: $IMAGE"
                    SCANNED=$((SCANNED + 1))

                    # Run Trivy license scan
                    if trivy image --scanners license --format json --timeout 5m "$IMAGE" 2>/dev/null > /tmp/result.json; then
                      # Check for disallowed licenses
                      for LICENSE in $DISALLOWED; do
                        if grep -q "\"$LICENSE\"" /tmp/result.json; then
                          echo "  [VIOLATION] Found $LICENSE in $IMAGE"
                          VIOLATIONS=$((VIOLATIONS + 1))
                        fi
                      done
                    else
                      echo "  [WARN] Could not scan $IMAGE"
                    fi
                  done < /shared/images.txt

                  echo ""
                  echo "=== Scan Summary ==="
                  echo "Images scanned: $SCANNED"
                  echo "Violations found: $VIOLATIONS"
                  echo "Completed: $(date -Iseconds)"

                  if [ "$VIOLATIONS" -gt 0 ]; then
                    echo ""
                    echo "[ACTION REQUIRED] Review images with copyleft licenses"
                  fi

                  echo ""
                  echo "License scan complete."
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: shared
                  mountPath: /shared
          volumes:
            - name: config
              configMap:
                name: license-policy
            - name: shared
              emptyDir: {}
---
# RBAC for license scanner
apiVersion: v1
kind: ServiceAccount
metadata:
  name: license-scanner
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: license-scanner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: license-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: license-scanner
subjects:
  - kind: ServiceAccount
    name: license-scanner
    namespace: security
