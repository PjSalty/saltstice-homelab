---
# VPA for Trivy Operator
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trivy-operator
  namespace: security
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trivy-operator
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: trivy-operator
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
