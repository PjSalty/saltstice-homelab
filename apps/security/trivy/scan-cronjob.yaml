---
# Trivy Daily Vulnerability Scan CronJob
# Scans all container images and persists reports for 30-day retention
# Updated: 2026-02-01 - Fixed Flux variable substitution by escaping shell variables
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-full-scan
  namespace: security
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: trivy-operator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: collect-images
              image: ${IMAGE_KUBECTL}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  echo "Collecting images from cluster..."
                  kubectl get pods --all-namespaces -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | \
                    sort -u | grep -v '^$$' > /shared/images.txt
                  echo "Found $$(wc -l < /shared/images.txt) unique images"
              volumeMounts:
                - name: shared-data
                  mountPath: /shared
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          containers:
            - name: trivy-scan
              # Version managed by config/versions.yaml via Flux substituteFrom
              image: ${IMAGE_TRIVY}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false  # Trivy needs to write cache
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  REPORT_DATE=$$(date +%Y-%m-%d)
                  REPORT_DIR="/reports/$${REPORT_DATE}"

                  echo "=== Trivy Daily Vulnerability Scan ==="
                  echo "Date: $${REPORT_DATE}"
                  echo "Report Directory: $${REPORT_DIR}"
                  echo ""

                  # Create report directory
                  mkdir -p "$${REPORT_DIR}"

                  # Cleanup reports older than 30 days
                  echo "Cleaning up reports older than 30 days..."
                  find /reports -maxdepth 1 -type d -name "20*" -mtime +30 -exec rm -rf {} \; 2>/dev/null || true

                  # Read image list from init container
                  cp /shared/images.txt /tmp/images.txt

                  TOTAL_IMAGES=$$(wc -l < /tmp/images.txt)
                  echo "Found $${TOTAL_IMAGES} unique images to scan"
                  echo ""

                  # Initialize summary counters
                  CRITICAL_TOTAL=0
                  HIGH_TOTAL=0
                  MEDIUM_TOTAL=0
                  SCAN_COUNT=0
                  FAILED_COUNT=0

                  # Scan each image and generate JSON report
                  while read -r image; do
                    if [ -z "$$image" ]; then continue; fi

                    SCAN_COUNT=$$((SCAN_COUNT + 1))
                    SAFE_NAME=$$(echo "$$image" | tr '/:@' '___')
                    REPORT_FILE="$${REPORT_DIR}/$${SAFE_NAME}.json"

                    echo "[$${SCAN_COUNT}/$${TOTAL_IMAGES}] Scanning: $${image}"

                    if trivy image --severity CRITICAL,HIGH,MEDIUM --format json --output "$${REPORT_FILE}" "$$image" 2>/dev/null; then
                      # Extract vulnerability counts
                      if [ -f "$${REPORT_FILE}" ]; then
                        CRITICAL=$$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$${REPORT_FILE}" 2>/dev/null || echo "0")
                        HIGH=$$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$${REPORT_FILE}" 2>/dev/null || echo "0")
                        MEDIUM=$$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$${REPORT_FILE}" 2>/dev/null || echo "0")

                        CRITICAL_TOTAL=$$((CRITICAL_TOTAL + CRITICAL))
                        HIGH_TOTAL=$$((HIGH_TOTAL + HIGH))
                        MEDIUM_TOTAL=$$((MEDIUM_TOTAL + MEDIUM))

                        if [ "$$CRITICAL" -gt 0 ] || [ "$$HIGH" -gt 0 ]; then
                          echo "  CRITICAL: $${CRITICAL} | HIGH: $${HIGH} | MEDIUM: $${MEDIUM}"
                        fi
                      fi
                    else
                      echo "  Warning: Failed to scan $${image}"
                      FAILED_COUNT=$$((FAILED_COUNT + 1))
                    fi
                  done < /tmp/images.txt

                  # Generate daily summary
                  SUMMARY_FILE="$${REPORT_DIR}/summary.json"
                  cat > "$${SUMMARY_FILE}" << EOF
                  {
                    "scan_date": "$${REPORT_DATE}",
                    "total_images": $${TOTAL_IMAGES},
                    "successful_scans": $$((SCAN_COUNT - FAILED_COUNT)),
                    "failed_scans": $${FAILED_COUNT},
                    "vulnerabilities": {
                      "critical": $${CRITICAL_TOTAL},
                      "high": $${HIGH_TOTAL},
                      "medium": $${MEDIUM_TOTAL}
                    }
                  }
                  EOF

                  echo ""
                  echo "=== Scan Complete ==="
                  echo "Images Scanned: $$((SCAN_COUNT - FAILED_COUNT))/$${TOTAL_IMAGES}"
                  echo "Failed: $${FAILED_COUNT}"
                  echo "CRITICAL: $${CRITICAL_TOTAL}"
                  echo "HIGH: $${HIGH_TOTAL}"
                  echo "MEDIUM: $${MEDIUM_TOTAL}"
                  echo ""
                  echo "Reports saved to: $${REPORT_DIR}"
                  echo "Report retention: 30 days"

                  # List report directory size
                  du -sh /reports 2>/dev/null || true
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: shared-data
                  mountPath: /shared
                  readOnly: true
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: trivy-reports
            - name: shared-data
              emptyDir:
                sizeLimit: 10Mi
