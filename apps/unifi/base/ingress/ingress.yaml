# UniFi Controller Ingress with Authentik Forward Auth
# Changed from TLS passthrough to TLS termination to enable forward auth
# Forward auth provides SSO for non-OIDC-capable applications
---
# IngressRoute for UniFi with forward auth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: unifi.example.com
    external-dns.alpha.kubernetes.io/target: "${TRAEFIK_LB_IP}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.example.com`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: unifi
          namespace: unifi
          port: 8443
          scheme: https
          serversTransport: unifi-unifi-backend-transport@kubernetescrd
  tls:
    secretName: wildcard-tls
---
# UniFi backend uses a self-signed certificate (not Homelab CA)
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-backend-transport
  namespace: unifi
spec:
  insecureSkipVerify: true
