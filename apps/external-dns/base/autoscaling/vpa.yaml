---
# VPA for external-dns (Auto mode - applies recommendations)
# Multi-container: external-dns + adguard-webhook sidecar
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns
  namespace: external-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: external-dns
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 250m
          memory: 256Mi
      - containerName: adguard-webhook
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 100m
          memory: 128Mi
