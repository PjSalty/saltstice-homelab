---
# Vaultwarden SQLite backup CronJob
# Copies SQLite database file for consistent backup (WAL mode)
# Retains 7 days of daily backups on NFS
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sqlite-backup
              image: ${IMAGE_ALPINE}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/vaultwarden-$${TIMESTAMP}.sqlite3"

                  echo "[$(date)] Starting Vaultwarden SQLite backup"

                  # Copy SQLite database (read-only mount, WAL mode
                  # ensures consistency for file-level copies)
                  cp /data/db.sqlite3 "$${BACKUP_FILE}"
                  # Include WAL/SHM if present for full consistency
                  cp /data/db.sqlite3-wal "$${BACKUP_FILE}-wal" 2>/dev/null || true
                  cp /data/db.sqlite3-shm "$${BACKUP_FILE}-shm" 2>/dev/null || true
                  echo "[$(date)] SQLite copy complete"

                  # Compress the backup
                  gzip "$${BACKUP_FILE}"
                  rm -f "$${BACKUP_FILE}-wal" "$${BACKUP_FILE}-shm"
                  echo "[$(date)] Compressed: $(du -h "$${BACKUP_FILE}.gz" | cut -f1)"

                  # Also backup attachments if they exist
                  if [ -d /data/attachments ] && [ "$(ls -A /data/attachments 2>/dev/null)" ]; then
                    tar czf "/backups/vaultwarden-attachments-$${TIMESTAMP}.tar.gz" -C /data attachments
                    echo "[$(date)] Attachments backup: $(du -h "/backups/vaultwarden-attachments-$${TIMESTAMP}.tar.gz" | cut -f1)"
                  fi

                  # Retention: keep last 7 days
                  find /backups -name "vaultwarden-*.sqlite3.gz" -mtime +7 -delete
                  find /backups -name "vaultwarden-attachments-*.tar.gz" -mtime +7 -delete
                  echo "[$(date)] Current backups:"
                  ls -lh /backups/vaultwarden-* 2>/dev/null || echo "  (none)"
              volumeMounts:
                - name: vaultwarden-data
                  mountPath: /data
                  readOnly: true
                - name: backup-storage
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: vaultwarden-data
            - name: backup-storage
              persistentVolumeClaim:
                claimName: vaultwarden-backups
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
