apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core application
  - namespace.yaml
  - deployments/deployment.yaml
  - services/service.yaml
  - ingress/ingress.yaml
  - storage/pvc.yaml
  - pdb/pdb.yaml
  # SQLite backup (daily, 7-day retention on NFS)
  - backup/pvc.yaml
  - backup/cronjob.yaml
  - autoscaling
  - networkpolicy
