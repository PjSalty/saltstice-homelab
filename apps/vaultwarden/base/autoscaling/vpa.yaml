---
# VPA for vaultwarden (Auto mode - applies recommendations)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultwarden
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: vaultwarden
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
