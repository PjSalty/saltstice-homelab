# OIDCWarden — Vaultwarden fork with native SSO support.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate # iSCSI PVC is RWO
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: vaultwarden
          image: ${IMAGE_VAULTWARDEN}
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - { containerPort: 80, name: http, protocol: TCP }
            - { containerPort: 3012, name: websocket, protocol: TCP }
          env:
            - name: DOMAIN
              value: https://vault.example.com
            - name: SIGNUPS_ALLOWED
              value: "false" # invite-only via SSO groups
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: SHOW_PASSWORD_HINT
              value: "false"
            # SSO via Authentik — see sso-client-secrets
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false" # master-password fallback if SSO is down
            - name: SSO_CLIENT_ID
              value: vaultwarden-sso
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-client-secrets
                  key: VAULTWARDEN_CLIENT_SECRET
            - name: SSO_AUTHORITY
              value: https://auth.example.com/application/o/vaultwarden/
            - name: SSO_CALLBACK_PATH
              value: /identity/connect/oidc-signin
            - name: SSO_SCOPES
              value: openid email profile offline_access
            - name: SSO_FRONTEND
              value: override
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /alive, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /alive, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
