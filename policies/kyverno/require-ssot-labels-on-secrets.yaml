---
# Kyverno Policy: Require SSOT Labels on Secrets
# Ensures secrets have proper source-of-truth labeling for credential lifecycle tracking.
#
# Mode: Audit (warns on violations, does not block)
# Background: false (only checks at admission time, prevents event noise)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ssot-labels-on-secrets
  annotations:
    policies.kyverno.io/title: Require SSOT Labels on Secrets
    policies.kyverno.io/category: Compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      All secrets should have labels indicating their source of truth
      (credentials.sops.yaml, ansible-vault, or manual). This helps
      track credential lifecycle and rotation.
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: require-ssot-label
      match:
        any:
          - resources:
              kinds:
                - Secret
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
                - karpenter
                - cert-manager
                - gitlab-runner
                - default
                - metallb-system
                - democratic-csi
                - vpa
                - security
          - resources:
              names:
                - "*-token-*"
                - "sh.helm.*"
                - "default-token*"
                - "runner-*"
                - "alertmanager-*-generated"
                - "alertmanager-*-tls-config"
                - "alertmanager-*-tls-assets-*"
                - "alertmanager-*-web-config"
                - "prometheus-*-tls-assets-*"
                - "prometheus-*-web-config"
                - "prometheus-*-thanos-*"
                - "scan-vulnerabilityreport-*"
          - resources:
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: In
                    values:
                      - kyverno
                      - trivy-operator
                      - prometheus-operator
                      - Helm
      validate:
        message: >-
          Secrets should have a 'ssot.example.com/source' label
          indicating the source of truth (e.g., 'credentials-sops',
          'ansible-vault', 'manual', 'cert-manager').
        pattern:
          metadata:
            labels:
              ssot.example.com/source: "?*"
