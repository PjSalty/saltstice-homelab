---
# Kyverno Policy: Restrict ExternalSecret to approved namespaces
# Prevents unauthorized namespaces from creating ExternalSecret resources,
# which would allow reading from the credential source Secrets.
#
# Mode: Enforce (blocks creation in unapproved namespaces)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-externalsecret-namespaces
  annotations:
    policies.kyverno.io/title: Restrict ExternalSecret Namespaces
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      ExternalSecret resources can only be created in approved namespaces
      that have legitimate credential requirements. This prevents unauthorized
      namespaces from reading the credential SSOT source Secrets.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: restrict-externalsecret-namespaces
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
      validate:
        message: >-
          ExternalSecret resources are only allowed in approved namespaces.
          Contact the platform team to add your namespace to the allow list.
        deny:
          conditions:
            all:
              - key: "{{request.namespace}}"
                operator: AnyNotIn
                value:
                  - authentik
                  - automation
                  - cert-manager
                  - cloudflared
                  - democratic-csi
                  - docmost
                  - external-dns
                  - gitlab-runner
                  - headlamp
                  - karpenter
                  - matrix
                  - mcp-server
                  - media
                  - monitoring
                  - netbox
                  - semaphore
                  - storage
                  - unifi
                  - vaultwarden
                  - velero
                  - vm-certificates
                  - vpn
