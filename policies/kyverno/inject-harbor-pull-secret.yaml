---
# Inject Harbor imagePullSecrets into all pods
# Ensures all pods can pull from private Harbor registry
# Works with Deployments, StatefulSets, DaemonSets, Jobs, CronJobs
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-harbor-pull-secret
  annotations:
    policies.kyverno.io/title: Inject Harbor Pull Secret
    policies.kyverno.io/category: Registry Authentication
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Automatically injects imagePullSecrets for Harbor registry into
      all pods. This ensures authenticated pulls from private Harbor
      projects without requiring per-namespace configuration.
spec:
  rules:
    - name: add-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: harbor-pull-secret
