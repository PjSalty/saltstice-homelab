---
# Replicate Harbor pull secret to all namespaces
# Source: flux-system/harbor-pull-secret (SOPS-encrypted, robot$<pull-account>)
# Target: all namespaces (excluding system namespaces)
# Provides authenticated pull access to private Harbor registry
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-harbor-pull-secret
  annotations:
    policies.kyverno.io/title: Sync Harbor Pull Secret
    policies.kyverno.io/category: Registry Authentication
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Clones the Harbor registry pull secret from flux-system to all
      namespaces. Uses robot$<pull-account> account with read-only permissions.
      Keeps secrets synchronized when rotated.
spec:
  rules:
    - name: clone-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                - kube-node-lease
                - kube-public
                - flux-system
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: harbor-pull-secret
        namespace: "{{request.object.metadata.name}}"
        clone:
          namespace: flux-system
          name: harbor-pull-secret
