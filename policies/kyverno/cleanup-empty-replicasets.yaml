---
# Kyverno CleanupPolicy: Remove Empty ReplicaSets
# Old ReplicaSets from Deployment rollouts that have 0 replicas.
# Kubernetes keeps revisionHistoryLimit (default 10) ReplicaSets per Deployment.
# This policy cleans up the ones with 0 desired and 0 actual replicas.
apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-empty-replicasets
  labels:
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: kyverno
spec:
  schedule: "0 4 * * *"  # Daily at 4 AM (after cluster-cleanup at 3 AM)
  match:
    any:
      - resources:
          kinds:
            - ReplicaSet
  exclude:
    any:
      - resources:
          namespaces:
            - kube-system
            - flux-system
  conditions:
    all:
      - key: "{{ spec.replicas || `0` }}"
        operator: Equals
        value: 0
      - key: "{{ status.replicas || `0` }}"
        operator: Equals
        value: 0
