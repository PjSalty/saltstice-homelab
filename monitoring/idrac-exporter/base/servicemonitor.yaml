---
# ServiceMonitor for idrac_exporter - Dell iDRAC Prometheus Exporter
# Uses params to specify target iDRAC host for multi-target pattern
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-exporter
  namespace: monitoring
  labels:
    app: idrac-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: idrac-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 55s
      path: /metrics
      params:
        target:
          - <mgmt-ip>
      relabelings:
        - targetLabel: instance
          replacement: idrac
