---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - storage/pvc.yaml
  - secrets/grafana-admin-secret.yaml
  - config/grafana-config.yaml
  - config/datasources.yaml
  - config/dashboard-provider.yaml
  - deployment/deployment.yaml
  - service/service.yaml
  - ingress/ingress.yaml
  - jobs/dashboards-init-job.yaml

configMapGenerator:
  - name: grafana-dashboards-files
    namespace: monitoring
    files:
      - kubernetes-cluster.json=dashboards/kubernetes-cluster-dashboard.json
      - node-metrics.json=dashboards/node-exporter-dashboard.json
      - traefik-ingress.json=dashboards/traefik-dashboard.json
      - trivy-vulnerabilities.json=dashboards/trivy-vulnerability-dashboard.json
      - security-overview.json=dashboards/security-overview-dashboard.json
      - kubernetes-audit.json=dashboards/kubernetes-audit-dashboard.json

labels:
  - pairs:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: monitoring
