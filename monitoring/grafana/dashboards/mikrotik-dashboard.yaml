# MikroTik MKTXP Dashboard - Comprehensive monitoring for all MikroTik devices
# Metric names updated for MKTXP v1.2.15+ (mktxp_system_* replaces mktxp_resource_*)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mikrotik
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
  annotations:
    grafana_folder: "Networking"
data:
  mikrotik-dashboard.json: |
    {
      "annotations": {"list": []},
      "title": "MikroTik MKTXP",
      "uid": "mikrotik-mktxp",
      "tags": ["mikrotik", "mktxp", "network"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "router",
            "type": "query",
            "query": "label_values(mktxp_system_uptime, routerboard_name)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "title": "System Overview",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "collapsed": false
        },
        {
          "title": "Router Uptime",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 1},
          "targets": [{"expr": "mktxp_system_uptime{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 86400}, {"color": "green", "value": 604800}]}}}
        },
        {
          "title": "CPU Load",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 1},
          "targets": [{"expr": "mktxp_system_cpu_load{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 80}]}}}
        },
        {
          "title": "Memory Usage",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 1},
          "targets": [{"expr": "100 - (mktxp_system_free_memory{routerboard_name=~\"$router\"} / mktxp_system_total_memory{routerboard_name=~\"$router\"} * 100)", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}}
        },
        {
          "title": "CPU Frequency",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 1},
          "targets": [{"expr": "mktxp_system_cpu_frequency{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "hertz", "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}}
        },
        {
          "title": "CPU Temperature",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 1},
          "targets": [{"expr": "mktxp_system_cpu_temperature{routerboard_name=~\"$router\"} * 9/5 + 32", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "fahrenheit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 140}, {"color": "red", "value": 167}]}}}
        },
        {
          "title": "Board Temperature",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 1},
          "targets": [{"expr": "mktxp_system_board_temperature1{routerboard_name=~\"$router\"} * 9/5 + 32", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "fahrenheit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 131}, {"color": "red", "value": 158}]}}}
        },
        {
          "title": "HDD Usage",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 5},
          "targets": [{"expr": "100 - (mktxp_system_free_hdd_space{routerboard_name=~\"$router\"} / mktxp_system_total_hdd_space{routerboard_name=~\"$router\"} * 100)", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 90}]}}}
        },
        {
          "title": "Voltage",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 5},
          "targets": [{"expr": "mktxp_system_routerboard_voltage{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "volt", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 11}, {"color": "red", "value": 14}]}}}
        },
        {
          "title": "Active Users",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 5},
          "targets": [{"expr": "count by (routerboard_name) (mktxp_active_users_info{routerboard_name=~\"$router\"})", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3}]}}}
        },
        {
          "title": "DHCP Leases",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 5},
          "targets": [{"expr": "mktxp_dhcp_lease_active_count{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} - {{server}}"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 200}]}}}
        },
        {
          "title": "Total Routes",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 5},
          "targets": [{"expr": "mktxp_routes_total_routes{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}}
        },
        {
          "title": "IP Pool Usage",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 5},
          "targets": [{"expr": "mktxp_ip_pool_used{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} - {{pool}}"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 200}]}}}
        },
        {
          "title": "Interface Traffic",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9},
          "collapsed": false
        },
        {
          "title": "Interface Traffic (bits/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 10},
          "targets": [
            {"expr": "rate(mktxp_interface_rx_byte_total{routerboard_name=~\"$router\", interface_type!=\"bridge\", interface_type!=\"loopback\"}[5m]) * 8", "legendFormat": "{{routerboard_name}} {{name}} RX"},
            {"expr": "-rate(mktxp_interface_tx_byte_total{routerboard_name=~\"$router\", interface_type!=\"bridge\", interface_type!=\"loopback\"}[5m]) * 8", "legendFormat": "{{routerboard_name}} {{name}} TX"}
          ],
          "fieldConfig": {"defaults": {"unit": "bps", "custom": {"fillOpacity": 10, "axisPlacement": "auto"}}}
        },
        {
          "title": "Interface Errors",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 18},
          "targets": [
            {"expr": "rate(mktxp_interface_rx_error_total{routerboard_name=~\"$router\"}[5m])", "legendFormat": "{{routerboard_name}} {{name}} RX errors"},
            {"expr": "rate(mktxp_interface_tx_error_total{routerboard_name=~\"$router\"}[5m])", "legendFormat": "{{routerboard_name}} {{name}} TX errors"}
          ],
          "fieldConfig": {"defaults": {"unit": "pps", "custom": {"fillOpacity": 10}}}
        },
        {
          "title": "Interface Drops",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 18},
          "targets": [
            {"expr": "rate(mktxp_interface_rx_drop_total{routerboard_name=~\"$router\"}[5m])", "legendFormat": "{{routerboard_name}} {{name}} RX drops"},
            {"expr": "rate(mktxp_interface_tx_drop_total{routerboard_name=~\"$router\"}[5m])", "legendFormat": "{{routerboard_name}} {{name}} TX drops"}
          ],
          "fieldConfig": {"defaults": {"unit": "pps", "custom": {"fillOpacity": 10}}}
        },
        {
          "title": "Ethernet Port Status",
          "type": "table",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 24},
          "targets": [{"expr": "mktxp_interface_status{routerboard_name=~\"$router\"}", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "job": true, "instance": true, "service": true, "component": true}, "renameByName": {"routerboard_name": "Router", "name": "Interface", "interface_type": "Type", "Value": "Up"}}}]
        },
        {
          "title": "Link Downs",
          "type": "stat",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 24},
          "targets": [{"expr": "mktxp_link_downs_total{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}
        },
        {
          "title": "SFP Optics",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 30},
          "collapsed": false
        },
        {
          "title": "SFP Temperature",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 31},
          "targets": [{"expr": "mktxp_interface_sfp_temperature{routerboard_name=~\"$router\"} * 9/5 + 32", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "fahrenheit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 140}, {"color": "red", "value": 158}]}}}
        },
        {
          "title": "SFP TX Power",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 31},
          "targets": [{"expr": "mktxp_interface_sfp_tx_power{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "dBm"}}
        },
        {
          "title": "SFP RX Power",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 31},
          "targets": [{"expr": "mktxp_interface_sfp_rx_power{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "dBm"}}
        },
        {
          "title": "Firewall & Connections",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 37},
          "collapsed": false
        },
        {
          "title": "Firewall Filter Rules (bytes)",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "targets": [{"expr": "topk(20, mktxp_firewall_filter_total{routerboard_name=~\"$router\"})", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "job": true, "instance": true, "service": true, "component": true, "routerboard_address": true, "architecture_name": true, "board_name": true, "cpu": true, "version": true}, "renameByName": {"routerboard_name": "Router", "chain": "Chain", "comment": "Rule", "action": "Action", "Value": "Bytes"}}}]
        },
        {
          "title": "NAT Rules (bytes)",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
          "targets": [{"expr": "topk(20, mktxp_firewall_nat_total{routerboard_name=~\"$router\"})", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "job": true, "instance": true, "service": true, "component": true, "routerboard_address": true, "architecture_name": true, "board_name": true, "cpu": true, "version": true}, "renameByName": {"routerboard_name": "Router", "chain": "Chain", "comment": "Rule", "action": "Action", "Value": "Bytes"}}}]
        },
        {
          "title": "Open Connections",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 46},
          "targets": [
            {"expr": "mktxp_ip_connections_total{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} total connections"}
          ],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10000}, {"color": "red", "value": 50000}]}}}
        },
        {
          "title": "Connection Stats",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 46},
          "targets": [
            {"expr": "mktxp_connection_stats{routerboard_name=~\"$router\", connection_type=\"tcp\"}", "legendFormat": "{{routerboard_name}} TCP"},
            {"expr": "mktxp_connection_stats{routerboard_name=~\"$router\", connection_type=\"udp\"}", "legendFormat": "{{routerboard_name}} UDP"}
          ]
        },
        {
          "title": "Routes per Protocol",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 52},
          "targets": [{"expr": "mktxp_routes_protocol_count{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{protocol}}"}]
        },
        {
          "title": "DHCP Lease Details",
          "type": "table",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 52},
          "targets": [{"expr": "mktxp_dhcp_lease_info{routerboard_name=~\"$router\"}", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "job": true, "instance": true, "service": true, "component": true, "routerboard_address": true, "architecture_name": true, "board_name": true, "cpu": true, "version": true, "Value": true}, "renameByName": {"routerboard_name": "Router", "address": "IP", "mac_address": "MAC", "host_name": "Hostname", "server": "DHCP Server", "active_address": "Active"}}}]
        },
        {
          "title": "PoE",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 58},
          "collapsed": false
        },
        {
          "title": "PoE Output Power",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 59},
          "targets": [{"expr": "mktxp_poe_out_power{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "watt"}}
        },
        {
          "title": "PoE Output Voltage",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 59},
          "targets": [{"expr": "mktxp_poe_out_voltage{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "volt"}}
        },
        {
          "title": "PoE Output Current",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 59},
          "targets": [{"expr": "mktxp_poe_out_current{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{name}}"}],
          "fieldConfig": {"defaults": {"unit": "amp"}}
        },
        {
          "title": "Total PoE Consumption",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 65},
          "targets": [{"expr": "mktxp_system_poe_out_consumption{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "watt", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 100}, {"color": "red", "value": 200}]}}}
        },
        {
          "title": "PSU Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 65},
          "targets": [
            {"expr": "mktxp_system_psu1_voltage{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} PSU1 V"},
            {"expr": "mktxp_system_psu2_voltage{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} PSU2 V"}
          ],
          "fieldConfig": {"defaults": {"unit": "volt"}}
        },
        {
          "title": "Fan Speed",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 65},
          "targets": [
            {"expr": "mktxp_system_fan_one_speed{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} Fan 1"},
            {"expr": "mktxp_system_fan_two_speed{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} Fan 2"}
          ],
          "fieldConfig": {"defaults": {"unit": "rpm"}}
        },
        {
          "title": "Bandwidth & Performance",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 69},
          "collapsed": false
        },
        {
          "title": "Internet Bandwidth Test",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 70},
          "targets": [{"expr": "mktxp_internet_bandwidth{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{direction}}"}],
          "fieldConfig": {"defaults": {"unit": "bps"}}
        },
        {
          "title": "Internet Latency",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 70},
          "targets": [{"expr": "mktxp_internet_latency{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}}"}],
          "fieldConfig": {"defaults": {"unit": "ms", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "red", "value": 100}]}}}
        },
        {
          "title": "MKTXP Collection Time",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 76},
          "targets": [{"expr": "mktxp_collection_time_total{routerboard_name=~\"$router\"}", "legendFormat": "{{routerboard_name}} {{collection}}"}],
          "fieldConfig": {"defaults": {"unit": "s"}}
        }
      ]
    }
