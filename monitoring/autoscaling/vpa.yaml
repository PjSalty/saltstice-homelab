---
# VPA for Grafana (kube-prometheus-stack subchart)
# Multi-container: main grafana + 2 k8s-sidecar containers
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-kube-prometheus-stack-grafana
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
      - containerName: grafana-sc-dashboard
        minAllowed:
          cpu: 25m
          memory: 128Mi
        maxAllowed:
          cpu: 500m
          memory: 1Gi
      - containerName: grafana-sc-datasources
        minAllowed:
          cpu: 25m
          memory: 128Mi
        maxAllowed:
          cpu: 500m
          memory: 1Gi
---
# VPA for Prometheus Operator
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-prometheus-operator
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-kube-prometheus-operator
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: kube-prometheus-stack
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
---
# VPA for kube-state-metrics
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-kube-prometheus-stack-kube-state-metrics
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: kube-state-metrics
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: 500m
          memory: 256Mi
---
# VPA for AlertManager
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: alertmanager-monitoring-kube-prometheus-alertmanager
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: alertmanager
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: 500m
          memory: 256Mi
      - containerName: config-reloader
        minAllowed:
          cpu: 10m
          memory: 16Mi
        maxAllowed:
          cpu: 100m
          memory: 64Mi
---
# VPA for Prometheus
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: prometheus-monitoring-kube-prometheus-prometheus
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed:
          cpu: 250m
          memory: 1Gi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
      - containerName: config-reloader
        minAllowed:
          cpu: 10m
          memory: 16Mi
        maxAllowed:
          cpu: 100m
          memory: 64Mi
---
