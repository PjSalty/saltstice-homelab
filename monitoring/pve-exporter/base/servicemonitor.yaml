---
# ServiceMonitor for pve-exporter - Proxmox VE Prometheus Exporter
# Uses params to specify target host for multi-target pattern
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pve-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 55s
      path: /pve
      params:
        target:
          - <internal-ip>
        cluster:
          - "1"
        node:
          - "1"
      relabelings:
        - targetLabel: instance
          replacement: proxmox
