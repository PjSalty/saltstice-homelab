---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system
resources:
  - ipaddresspool.yaml
  # BGP mode enabled - MetalLB advertises VLAN 50 IPs via BGP to MikroTik router
  # Workers are on VLAN 30, LoadBalancer IPs on VLAN 50 - requires BGP routing
  - bgppeer.yaml
  - bgpadvertisement.yaml
  # DMZ pool - VLAN 60 community-facing services (Matrix, Fluxer)
  - dmz-pool.yaml
  # L2 mode disabled - doesn't work across VLANs
  # - l2advertisement.yaml
