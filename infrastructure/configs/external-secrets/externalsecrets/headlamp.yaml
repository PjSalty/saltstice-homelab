# headlamp-oidc-secret: OIDC client secret for Headlamp.
#
# The client secret is sourced from the credential store like every other SSO
# integration in the estate, rather than being carried in this manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: credential-core
    kind: SecretStore
  target:
    name: headlamp-oidc-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: "headlamp"
          app.kubernetes.io/component: "oidc"
      data:
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
  - secretKey: oidc_client_secret
    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_SSO_CLIENTS_HEADLAMP_CLIENT_SECRET
