    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_USERS_MICHAEL_PASSWORD
  - secretKey: DRE_PASSWORD
    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_USERS_DRE_PASSWORD
  - secretKey: TIMM_PASSWORD
    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_USERS_TIMM_PASSWORD
  - secretKey: MATTHEW_PASSWORD
    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_USERS_MATTHEW_PASSWORD
  - secretKey: RENEA_PASSWORD
    remoteRef:
      key: cred-ssot-core
      property: CRED_AUTHENTIK_USERS_RENEA_PASSWORD
