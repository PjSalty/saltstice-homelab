---
# Proxmox Endpoints and Service
# Proxmox is reachable on K8s VLAN (10.x0.100) for Traefik backend access
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 10.x0.100
    ports:
      - port: 8006
        name: https
---
apiVersion: v1
kind: Service
