  name: proxmox-external
  namespace: traefik
spec:
  ports:
    - port: 8006
      targetPort: 8006
      name: https
---
# Proxmox IngressRoute (native OIDC via Authentik - no forward auth needed)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: proxmox.example.com
    external-dns.alpha.kubernetes.io/target: <internal-ip>
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`proxmox.example.com`)
      kind: Rule
      middlewares:
        - name: proxmox-security-headers
      services:
        - name: proxmox-external
          port: 8006
          scheme: https
          passHostHeader: true
          serversTransport: traefik-proxmox-ca-trust@kubernetescrd
  tls:
    secretName: wildcard-tls
---
