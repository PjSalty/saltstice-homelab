---
# External Services with Authentik Forward Auth
# These services are outside the cluster but accessible via Traefik with SSO
#
# TrueNAS: <internal-ip> (Storage VLAN)
# AdGuard: <internal-ip> (Infrastructure VLAN)
---
# TrueNAS Endpoints and Service
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-external
  namespace: traefik
subsets:
  - addresses:
      - ip: <internal-ip>
    ports:
      - port: 443
        name: https
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  ports:
    - port: 443
      targetPort: 443
      name: https
---
# TrueNAS IngressRoute (No forward-auth - breaks TrueNAS UI, no OIDC support anyway)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik

    external-dns.alpha.kubernetes.io/hostname: truenas.example.com
    external-dns.alpha.kubernetes.io/target: <internal-ip>
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`truenas.example.com`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: truenas-external
          port: 443
          scheme: https
          passHostHeader: true
          serversTransport: traefik-truenas-ca-trust@kubernetescrd
  tls:
    secretName: wildcard-tls
---
# AdGuard Endpoints and Service
apiVersion: v1
kind: Endpoints
metadata:
  name: adguard-external
  namespace: traefik
subsets:
  - addresses:
      - ip: <internal-ip>
    ports:
      - port: 80
        name: http
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-external
  namespace: traefik
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
---
# AdGuard IngressRoute with Forward Auth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik

    external-dns.alpha.kubernetes.io/hostname: adguard.example.com
    external-dns.alpha.kubernetes.io/target: <internal-ip>
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.example.com`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
        - name: security-headers
      services:
        - name: adguard-external
          port: 80
          scheme: http
  tls:
    secretName: wildcard-tls
---
