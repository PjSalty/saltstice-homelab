        - name: security-headers
      services:
        - name: haproxy-stats-external
          port: 9000
          scheme: http
  tls:
    secretName: wildcard-tls
---
# Per-service ServersTransports for backend TLS verification
# Each needs serverName because Traefik connects via IP but certs are for FQDNs
# VMs serve Let's Encrypt certs — verified against Traefik's default trust store
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas-ca-trust
  namespace: traefik
spec:
  serverName: truenas.example.com
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gitlab-ca-trust
  namespace: traefik
spec:
  serverName: gitlab.example.com
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox-ca-trust
  namespace: traefik
spec:
  serverName: proxmox.example.com
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: harbor-ca-trust
  namespace: traefik
spec:
  serverName: harbor.example.com
