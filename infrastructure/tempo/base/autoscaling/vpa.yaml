---
# VPA for Tempo (monolithic tracing backend)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tempo
  namespace: tempo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tempo
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: tempo
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
