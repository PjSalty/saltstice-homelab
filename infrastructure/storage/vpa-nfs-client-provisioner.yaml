---
# VPA for NFS CSI driver provisioner
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nfs-client-provisioner
  namespace: nfs-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nfs-client-provisioner
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: nfs-client-provisioner
        minAllowed:
          cpu: 10m
          memory: 16Mi
        maxAllowed:
          cpu: 250m
          memory: 256Mi
