---
# Fairwinds Goldilocks v10.2.0 - VPA Recommendations Dashboard
# Researched: 2026-02-10
# Source: https://artifacthub.io/packages/helm/fairwinds-stable/goldilocks
#
# Goldilocks watches namespaces with label goldilocks.fairwinds.com/enabled: "true"
# and auto-creates VPA objects in Off mode to collect resource recommendations.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: "10.3.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # VPA managed separately via dedicated HelmRelease
    vpa:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi
    dashboard:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
