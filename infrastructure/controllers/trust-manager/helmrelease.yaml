---
# trust-manager - Distributes CA trust bundles to all namespaces
# Chart: v0.20.3
# Researched: 2026-02-11
# Source: https://github.com/cert-manager/trust-manager/releases
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: trust-manager
      version: "v0.22.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    # Security context managed by chart defaults (runAsNonRoot, readOnlyRootFilesystem, drop ALL)
    priorityClassName: system-cluster-critical
