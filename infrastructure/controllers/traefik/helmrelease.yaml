---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
  annotations:
    config.kubernetes.io/origin: "config/versions.yaml"
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "39.0.8"  # Per config/versions.yaml SSOT
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml
