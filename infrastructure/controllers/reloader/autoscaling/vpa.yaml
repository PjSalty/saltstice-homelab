---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: reloader
  namespace: reloader
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reloader-reloader
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: reloader-reloader
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 128Mi
