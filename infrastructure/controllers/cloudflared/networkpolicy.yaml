---
# CiliumNetworkPolicy for cloudflared tunnel
# Only needs: DNS resolution + outbound HTTPS to Cloudflare edge
# No inbound connections required (tunnel is outbound-only)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  ingress: []
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Cloudflare edge (HTTPS + QUIC)
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
            - port: "7844"
              protocol: TCP
            - port: "7844"
              protocol: UDP
    # Internal Traefik DMZ for proxied traffic
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-dmz
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Internal Traefik for internal services (if needed)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Jellyfin direct access (Cloudflare Tunnel → Jellyfin pod)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
