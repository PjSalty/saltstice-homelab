---
# VPA for Cloudflared tunnel connector
# Memory-only: CPU managed by HPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudflared
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: cloudflared
        controlledResources: ["memory"]
        minAllowed:
          memory: 32Mi
        maxAllowed:
          memory: 256Mi
