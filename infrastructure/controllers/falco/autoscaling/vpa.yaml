---
# VPA for Falcosidekick event forwarder
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: falcosidekick
  namespace: falco
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: falco-falco-falcosidekick
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: falcosidekick
        minAllowed:
          cpu: 10m
          memory: 16Mi
        maxAllowed:
          cpu: 250m
          memory: 256Mi
