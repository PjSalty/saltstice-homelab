---
# VPA for kyverno admission controller
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-admission-controller
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: kyverno
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
---
# VPA for kyverno background controller
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-background-controller
  namespace: kyverno
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-background-controller
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: controller
        minAllowed:
          cpu: 25m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
---
# VPA for kyverno cleanup controller
apiVersion: autoscaling.k8s.io/v1
