---
# VPA for Traefik DMZ (external ingress controller)
# Memory-only: CPU managed by HPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik-dmz
  namespace: traefik-dmz
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik-dmz
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: traefik-dmz
        controlledResources: ["memory"]
        minAllowed:
          memory: 32Mi
        maxAllowed:
          memory: 512Mi
