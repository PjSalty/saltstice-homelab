---
# TLS hardening for DMZ Traefik: enforce TLS 1.2+ with strong cipher suites
# Named explicitly to avoid conflict with traefik/default TLSOption
# (duplicate "default" TLSOptions across namespaces causes Traefik to
# drop ALL TLS config and fall back to built-in defaults)
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: dmz-default
  namespace: traefik-dmz
spec:
  minVersion: VersionTLS12
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
  sniStrict: true
