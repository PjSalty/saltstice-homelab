---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.2"  # Per config/versions.yaml SSOT
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installCRDs: true
    global:
      leaderElection:
        namespace: cert-manager
    replicaCount: 1
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    cainjector:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
    # Disable DNS-01 self-check: cluster pods cannot reach external authoritative
    # nameservers (8.8.8.8, 1.1.1.1 unreachable). Challenges are presented correctly
    # via acme-dns — Let's Encrypt validates independently.
    extraArgs:
      - --dns01-recursive-nameservers=10.43.0.10:53
      - --dns01-recursive-nameservers-only
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Prometheus metrics on port 9402
    prometheus:
      enabled: true
      podmonitor:
        enabled: true
