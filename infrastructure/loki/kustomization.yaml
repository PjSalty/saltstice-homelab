# Loki Logging Stack Kustomization
# Uses Grafana Alloy instead of deprecated Promtail (EOL March 2026)
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loki

resources:
  - namespace.yaml
  - helmrelease.yaml
  - alloy-helmrelease.yaml
  - loki-external-service.yaml
  - security-alerts.yaml
  - logql-alerting-rules.yaml
  - autoscaling
