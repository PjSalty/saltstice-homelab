---
# Grafana Alloy HelmRelease - Log Collection Agent
# Researched: 2025-12-08
# Source: https://artifacthub.io/packages/helm/grafana/alloy
# Replaces deprecated Promtail (EOL March 2026)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: ${HELM_ALLOY}
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  dependsOn:
    - name: loki
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Run as DaemonSet for log collection on all nodes
    alloy:
      # Resources for main alloy container
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Alloy River configuration
      configMap:
        content: |
          // Grafana Alloy - Kubernetes Log Collection
          // Replaces deprecated Promtail

          logging {
            level  = "info"
            format = "logfmt"
          }

          // ============================================
          // Kubernetes Pod Discovery
          // ============================================
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel discovered pods
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Keep running pods only
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Succeeded|Failed|Unknown"
              action        = "drop"
            }

            // Set namespace label
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            // Set pod label
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            // Set container label
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Set node label
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            // Set app label from common k8s labels
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            // Fallback app label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
              regex         = "(.+)"
              action        = "replace"
            }

            // Set log file path
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          // ============================================
          // Log File Collection
          // ============================================
          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // ============================================
          // Log Processing Pipeline
          // ============================================
          loki.process "pods" {
            forward_to = [loki.write.loki.receiver]

            // Parse CRI format (containerd)
            stage.cri {}

            // Add static labels
            stage.static_labels {
              values = {
                cluster = "homelab",
                job     = "kubernetes-pods",
              }
            }

            // Extract log level from common patterns
            stage.regex {
              expression = "(?i)(?P<level>trace|debug|info|warn|warning|error|fatal|critical)"
            }

            stage.labels {
              values = {
                level = "",
              }
            }

            // Drop empty lines
            stage.drop {
              expression          = "^\\s*$"
              drop_counter_reason = "empty_line"
            }
          }

          // ============================================
          // Loki Write Endpoint
          // ============================================
          loki.write "loki" {
            endpoint {
              url       = "http://loki:3100/loki/api/v1/push"
              tenant_id = "homelab"
            }
          }

      # Mount log directories from host (required for log collection)
      mounts:
        varlog: true
        dockercontainers: true

    # Controller settings
    controller:
      type: daemonset
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

    # Config reloader sidecar resources
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # Service monitor for Prometheus
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-stack
