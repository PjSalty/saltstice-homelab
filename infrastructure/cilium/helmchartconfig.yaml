# Cilium HelmChartConfig for RKE2
# Enables kube-proxy replacement for better LoadBalancer handling
# Applied via RKE2 manifest directory on master nodes
# Version: Cilium 1.18.x (bundled with RKE2 v1.34.3)
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    kubeProxyReplacement: true
    k8sServiceHost: <internal-ip>
    k8sServicePort: 6443
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    loadBalancer:
      mode: dsr
      algorithm: maglev
    bpf:
      masquerade: true
    externalIPs:
      enabled: true
    nodePort:
      enabled: true
    hostPort:
      enabled: true
    socketLB:
      enabled: true
    hostFirewall:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: false
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
