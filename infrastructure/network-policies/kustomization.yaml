  - namespaces/security.yaml
  - namespaces/unifi.yaml
  - namespaces/amp.yaml
  - namespaces/gitlab-runner.yaml
  - namespaces/vpn.yaml
  - namespaces/docmost.yaml
  - namespaces/mcp-server.yaml
  # DMZ namespace policies
  - namespaces/traefik-dmz.yaml
