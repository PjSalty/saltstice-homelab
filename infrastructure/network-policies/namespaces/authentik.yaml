---
# Authentik SSO - needs access from all apps for authentication
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-authentik
  namespace: authentik
spec:
  description: "Allow Authentik SSO provider"
  endpointSelector: {}
  ingress:
    # Allow Traefik for web UI
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Allow all namespaces for OIDC authentication
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Allow MCP server read-only API access
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Allow monitoring scrape (Prometheus → postgres-exporter, redis-exporter)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
            - port: "9121"
              protocol: TCP
    # Allow intra-namespace (server→postgres, server→redis, worker→server)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
  egress:
    # Allow internal PostgreSQL/Redis
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Allow LDAP/external IdP if needed
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "636"
              protocol: TCP
    # DNS resolution (required per Cilium bug #34390 — CCNP DNS
    # rules silently overridden when CNP has toEndpoints egress)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
