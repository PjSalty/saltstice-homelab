---
# Vaultwarden - Password manager
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vaultwarden
  namespace: vaultwarden
spec:
  description: "Allow Vaultwarden password manager"
  endpointSelector: {}
  ingress:
    # Allow Traefik for web UI and websocket
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3012"
              protocol: TCP
  egress:
    # Allow Authentik for SSO
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Allow push notifications
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DNS resolution (required per Cilium bug #34390 — CCNP DNS
    # rules silently overridden when CNP has toEndpoints egress)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
