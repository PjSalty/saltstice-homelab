---
# Pod Security Admission (PSA) Labels for Namespaces
# Deployed via dedicated Flux Kustomization with force: true
# to guarantee label ownership over app namespace.yaml conflicts
#
# Levels:
# - privileged: Unrestricted (system components needing host access)
# - baseline: Minimally restrictive (prevents known privilege escalations)
# - restricted: Heavily restricted (security best practices)

# =============================================================================
# PRIVILEGED - System namespaces requiring host/privileged access
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: democratic-csi
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
