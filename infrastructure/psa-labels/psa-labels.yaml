---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    # Privileged required for DinD builds (docker-in-docker)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    # Privileged required for NVIDIA GPU access and NFS volumes
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
