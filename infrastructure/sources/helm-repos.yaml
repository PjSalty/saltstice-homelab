---
# Traefik Helm Repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
# MetalLB Helm Repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
# cert-manager Helm Repository (Jetstack)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
# NOTE: Bitnami Helm Repository removed - Broadcom acquisition made public repos unmaintained
# external-dns now uses registry.k8s.io images directly, not Bitnami Helm chart
---
# NVIDIA Device Plugin Helm Repository (for GPU support)
# Researched: 2025-11-27
# Source: https://github.com/NVIDIA/k8s-device-plugin
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvdp
  namespace: flux-system
spec:
  interval: 1h
  url: https://nvidia.github.io/k8s-device-plugin
---
