---
# Resource Quotas for Application Namespaces
# Safety net against resource exhaustion and fork bombs.
# Limits are generous — designed to prevent runaway pods,
# not constrain normal operations.
#
# System namespaces (kube-system, flux-system, cilium, etc.)
# are intentionally excluded — they need operational flexibility.

# =============================================================================
# SMALL APPLICATION NAMESPACES (single-service, low resource)
# =============================================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: ntfy
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
