---
# LimitRanges for Namespaces with ResourceQuotas
# Provides default resource limits for containers that don't specify them.
# Without LimitRange, ResourceQuota rejects pods with incomplete resource specs
# (common with Helm chart init containers like download-dashboards, wait-for-lapi).
#
# Defaults are intentionally minimal — just enough to satisfy ResourceQuota.
# VPA Auto adjusts actual resources dynamically.

# =============================================================================
# SMALL APPLICATION NAMESPACES
# =============================================================================

apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ntfy
spec:
  limits:
    - default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      type: Container
