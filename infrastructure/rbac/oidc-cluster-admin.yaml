---
# OIDC Administrator Access for Homelab
#
# SECURITY NOTE: These cluster-admin bindings are INTENTIONAL for homelab administration.
# This is a single-owner homelab where the owner requires full cluster access.
#
# For production/enterprise environments:
#   - Replace cluster-admin with namespace-scoped roles
#   - Use RBAC aggregation for graduated permissions
#   - Implement just-in-time (JIT) access elevation
#
# Review date: 2026-01-31
# Reviewed by: Infrastructure audit
---
# OIDC User ClusterRoleBinding
# Grants cluster-admin to homelab owner authenticated via Authentik OIDC
# Username comes from preferred_username claim in OIDC token
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admin
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: authentication
  annotations:
    description: "Homelab owner admin access via OIDC"
    security.kubernetes.io/reviewed: "2026-01-31"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  # Homelab owner - matches preferred_username claim from Authentik
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: Salty
---
# OIDC Group ClusterRoleBinding
# Grants cluster-admin to members of headlamp-admins group from Authentik
# Group membership comes from groups claim in OIDC token
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-group-admin
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: authentication
  annotations:
    description: "Admin group access via OIDC"
    security.kubernetes.io/reviewed: "2026-01-31"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  # Admin group - matches groups claim from Authentik
  # Members managed in Authentik identity provider
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: headlamp-admins
