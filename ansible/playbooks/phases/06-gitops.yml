---
# Phase 6: GitOps Bootstrap
# Bootstraps FluxCD on the K8s cluster

- name: Bootstrap FluxCD
  hosts: masters[0]
  gather_facts: false
  tasks:
    - name: Check if Flux is already installed
      ansible.builtin.command:
        cmd: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get namespace flux-system
      register: flux_check
      changed_when: false
      failed_when: false
      become: true
      tags:
        - gitops

    - name: Bootstrap Flux
      ansible.builtin.command:
        cmd: >-
          flux bootstrap gitlab
          --owner=infrastructure
          --repository=homelab-kubernetes
          --branch=main
          --path=clusters/homelab
          --personal
      environment:
        GITLAB_TOKEN: "{{ lookup('env', 'GITLAB_TOKEN') }}"
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml
        PATH: "/var/lib/rancher/rke2/bin:{{ ansible_env.PATH }}"
      become: true
      when: flux_check.rc != 0
      changed_when: true
      tags:
        - gitops
