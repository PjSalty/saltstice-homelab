---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true
  tags:
    - docker
    - packages

- name: Find all Docker APT source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d/
    patterns: '*'
    contains: 'download.docker.com'
  register: docker_sources_found
  become: true
  tags:
    - docker
    - packages

- name: Remove all Docker APT source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_sources_found.files | default([]) }}"
  become: true
  tags:
    - docker
    - packages

- name: Remove Docker keys from all locations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/docker.gpg
    - /usr/share/keyrings/docker.asc
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.asc
  become: true
  tags:
    - docker
    - packages

- name: Remove Docker entries from main sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: 'download\.docker\.com'
    state: absent
  become: true
  tags:
    - docker
    - packages

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /tmp/docker-gpg-key.asc
    mode: "0644"
    force: true
  become: true
  tags:
    - docker
    - packages

- name: Dearmor Docker GPG key to binary format
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker-gpg-key.asc
  become: true
  changed_when: true
  tags:
    - docker
    - packages

- name: Set Docker GPG key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: "0644"
  become: true
  tags:
    - docker
    - packages

- name: Configure Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable\n"
    mode: "0644"
  become: true
  tags:
    - docker
    - packages

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  tags:
    - docker
    - packages

- name: Deploy Docker daemon config
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  become: true
  tags:
    - docker
    - config

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true
  tags:
    - docker
    - config

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  tags:
    - docker
