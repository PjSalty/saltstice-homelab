---
- name: Install Kubernetes prerequisite packages
  ansible.builtin.apt:
    name:
      - linux-headers-{{ ansible_kernel }}
      - open-iscsi
      - nfs-common
      - ipvsadm
      - jq
      - curl
    state: present
    update_cache: true
  become: true
  tags:
    - k8s-prereqs
    - packages

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"
  become: true
  tags:
    - k8s-prereqs
    - kernel

- name: Persist kernel modules across reboots
  ansible.builtin.template:
    src: k8s-modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - k8s-prereqs
    - kernel

- name: Apply Kubernetes sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
    state: present
  loop: "{{ k8s_sysctl | dict2items }}"
  become: true
  tags:
    - k8s-prereqs
    - sysctl

- name: Set transparent hugepages to madvise
  ansible.builtin.shell: |
    echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
    echo madvise > /sys/kernel/mm/transparent_hugepage/defrag
  changed_when: false
  become: true
  tags:
    - k8s-prereqs
    - performance

- name: Persist THP madvise across reboots
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/thp.conf
    content: |
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - madvise
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - k8s-prereqs
    - performance

- name: Disable swap
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false
  become: true
  tags:
    - k8s-prereqs

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\s+swap\s+'
    state: absent
  become: true
  tags:
    - k8s-prereqs

- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  become: true
  tags:
    - k8s-prereqs

- name: Create RKE2 manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  when: "'masters' in group_names"
  tags:
    - k8s-prereqs
    - rke2

- name: Deploy RKE2 Cilium config
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  when: "'masters' in group_names"
  tags:
    - k8s-prereqs
    - rke2

- name: Deploy RKE2 CoreDNS config (pin to control-plane nodes)
  ansible.builtin.template:
    src: rke2-coredns-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  when: "'masters' in group_names"
  tags:
    - k8s-prereqs
    - rke2
