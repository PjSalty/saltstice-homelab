---
# Reconcile Harbor admin (user_id=1) password to match the SSOT.
#
# Why this exists:
#   Harbor's admin password lives in harbor_user.password as
#   PBKDF2-HMAC-SHA256(password, salt, iterations=4096, key_length=16 bytes),
#   hex-encoded (32 chars). After incidents that lose Harbor PostgreSQL state
#   (db pod loss, restored snapshot pre-rotation, etc.) the row drifts from
#   the SSOT and admin auth breaks — taking down `helm push`, OCIRepository
#   reconciliation, the Web UI, and every API consumer with it.
#
# What this does:
#   On every harbor role run (i.e. every Semaphore harbor task), compute the
#   expected hash from the SSOT admin password + the live row's salt; if it
#   doesn't match, UPDATE the row, restart harbor-core to invalidate cached
#   credentials, and verify auth via /api/v2.0/users/current.
#
# Idempotency:
#   When in sync, this is a single read query — no writes, no restart.
#
# Reference:
#   https://github.com/goharbor/harbor/blob/v2.13.2/src/common/utils/encrypt.go
#     func Encrypt(content, salt, encryptAlg) string {
#       return fmt.Sprintf("%x", pbkdf2.Key([]byte(content), []byte(salt),
#                                            4096, 16, HashAlg[encryptAlg]))
#     }

- name: Get harbor-db status
  community.docker.docker_container_info:
    name: harbor-db
  register: harbor_db_info
  become: true

- name: Reconcile admin password to SSOT
  when:
    - harbor_db_info.exists | default(false)
    - (harbor_db_info.container.State.Status | default('')) == 'running'
    - harbor_admin_password is defined
    - harbor_admin_password != ''
    - harbor_admin_password != 'changeme'
  block:
    - name: Read admin user salt + current hash
      community.docker.docker_container_exec:
        container: harbor-db
        argv:
          - psql
          - -U
          - postgres
          - -d
          - registry
          - -tA
          - -F
          - "|"
          - -c
          - "SELECT salt, password, password_version FROM harbor_user WHERE user_id=1"
      register: harbor_admin_row
      become: true
      changed_when: false
      failed_when: false
      no_log: true

    # Surface the underlying error without exposing the password hash.
    # stderr from psql contains only diagnostics (auth/connection/schema),
    # not the SELECT result, so it is safe to render verbatim.
    - name: Report admin row read failure
      ansible.builtin.fail:
        msg: |
          Failed to read harbor_user row (rc={{ harbor_admin_row.rc | default('?') }}):
          {{ harbor_admin_row.stderr | default('') }}
      when: (harbor_admin_row.rc | default(0)) != 0

    - name: Parse salt + current hash + version
      ansible.builtin.set_fact:
        _harbor_salt: "{{ harbor_admin_row.stdout.strip().split('|')[0] }}"
        _harbor_current_hash: "{{ harbor_admin_row.stdout.strip().split('|')[1] }}"
        _harbor_pw_version: "{{ harbor_admin_row.stdout.strip().split('|')[2] }}"
      no_log: true

    - name: Compute expected admin password hash (PBKDF2-HMAC-SHA256, 4096 iter, 16-byte key)
      ansible.builtin.command:
        cmd: >-
          python3 -c
          "import os,hashlib;print(hashlib.pbkdf2_hmac('sha256',os.environ['P'].encode(),os.environ['S'].encode(),4096,16).hex())"
      environment:
        P: "{{ harbor_admin_password }}"
        S: "{{ _harbor_salt }}"
      register: _harbor_expected_hash
      changed_when: false
      no_log: true
      delegate_to: localhost

    - name: Update admin password hash (only when drifted)
      community.docker.docker_container_exec:
        container: harbor-db
        argv:
          - psql
          - -U
          - postgres
          - -d
          - registry
          - -c
          - >-
            -- redacted --
            SET password='{{ _harbor_expected_hash.stdout }}',
                password_version='sha256'
            WHERE user_id=1
      become: true
      register: _harbor_pw_update
      when:
        - (_harbor_current_hash != _harbor_expected_hash.stdout)
          or (_harbor_pw_version != 'sha256')
      changed_when: _harbor_pw_update.rc == 0
      notify:
        - Restart harbor-core
      no_log: true

    - name: Flush handlers (run harbor-core restart now if password updated)
      ansible.builtin.meta: flush_handlers

    - name: Verify admin auth via /api/v2.0/users/current
      ansible.builtin.uri:
        url: "https://{{ harbor_fqdn }}/api/v2.0/users/current"
        method: GET
        user: admin
        password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        status_code: 200
        validate_certs: true
      register: _harbor_auth_verify
      retries: 6
      delay: 5
      until: _harbor_auth_verify.status == 200
      delegate_to: localhost
      no_log: true
