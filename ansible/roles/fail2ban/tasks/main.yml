---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  become: true
  tags:
    - fail2ban
    - packages

- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  become: true
  tags:
    - fail2ban

- name: Enable fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: fail2ban_enabled
  become: true
  tags:
    - fail2ban
