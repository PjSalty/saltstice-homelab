---
# =============================================================================
# Kubernetes Applications - Managed by FluxCD
# Per automation.md: Only apps that should run in K8s, not VMs
# VMs: TrueNAS, GitLab, Harbor, NetBox, HAProxy, AdGuard
# SSOT: All apps use postBuild for variable substitution from ConfigMaps
# SECRETS: All secrets come from infrastructure/secrets repo via secrets-system
# =============================================================================

# Jellyfin - Media Server (GPU workload per automation.md)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/jellyfin/base
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  dependsOn:
    - name: secrets
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
      - kind: ConfigMap
        name: network-config
---
# Headlamp - Kubernetes Dashboard with OIDC SSO
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
