apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automation
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/automation
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
      - kind: ConfigMap
        name: network-config
---
# Docmost - Team Documentation Wiki
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docmost
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/docmost/base
  prune: true
  # wait: false because workspace-setup Job is one-shot
  wait: false
  timeout: 5m
  retryInterval: 2m
  # Health checks - only check deployment, not one-shot Job
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: docmost
      namespace: docmost
  dependsOn:
    - name: infrastructure-configs
    - name: secrets
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
      - kind: ConfigMap
        name: network-config
---
# MCP Server - homelab-cli serving Model Context Protocol over HTTP
