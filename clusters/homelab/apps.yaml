---
# =============================================================================
# DMZ / COMMUNITY SERVICES (VLAN 60) — ingress via traefik-dmz
# =============================================================================

# Matrix Synapse — REMOVED 2026-03-23
# No active users since 2026-03-22. Manifests deleted.
# Data PVCs preserved in cluster (synapse-data, synapse-postgresql-data, synapse-media).
# Secrets preserved in infrastructure/secrets repo.
# To restore: recreate apps/matrix/ from git history and add kustomization back.
---
# VPN - wg-easy Traefik Ingress and Connection Alerts
# wg-easy runs on external VM (<internal-ip>, DMZ VLAN 60)
# This provides HTTPS ingress via Traefik and ntfy connection alerts
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpn
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/vpn/base
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure-controllers
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
      - kind: ConfigMap
        name: network-config
