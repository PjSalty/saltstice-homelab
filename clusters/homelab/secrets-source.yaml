---
# GitRepository for SOPS-encrypted secrets
# This is a separate repository to allow automated credential rotation
# without merge conflicts with the main infrastructure repo
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: secrets-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@<internal-ip>:2222/infrastructure/secrets.git
  ref:
    branch: main
  secretRef:
    name: flux-system
