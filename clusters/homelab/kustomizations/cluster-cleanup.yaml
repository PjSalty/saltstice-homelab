---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-cleanup
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/controllers/cluster-cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
