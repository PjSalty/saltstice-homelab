---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ntfy
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/ntfy/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ntfy
      namespace: ntfy
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
        optional: false
