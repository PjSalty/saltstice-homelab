---
# Flux Kustomization for AMP Game Server Panel
# Routes HTTPS through Traefik to AMP VM at <internal-ip>
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amp
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/amp/base
  prune: true
  wait: true
  timeout: 5m0s
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: amp
