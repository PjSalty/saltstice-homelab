---
# Automation Kustomization
# Purpose: Deploys automation CronJobs for version checking, patching, etc.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automation
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/automation/version-researcher
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: image-versions
      - kind: ConfigMap
        name: network-config
