---
# Kustomization for secrets from the dedicated secrets repository
# Secrets are applied BEFORE apps to ensure they exist when pods start
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: secrets-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependencies - secrets are foundation layer
  # Apps kustomization will dependsOn: secrets
