name: style-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-typographic-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block em and en dashes in markdown
        run: |
          if grep -rnP '\x{2014}|\x{2013}' --include='*.md' .; then
            echo "typographic dashes found, use a comma or a plain hyphen"
            exit 1
          fi
