---
# AlertManager Pushover credentials
# This secret is referenced by AlertManager via envFrom to inject
# PUSHOVER_USER_KEY and PUSHOVER_TOKEN into the alertmanager pod.
#
# Populate with SOPS before committing:
#   sops --age <age-recipient> \
#        --encrypt --encrypted-regex '^(data|stringData|password|token|key|secret)$' \
#        alertmanager-pushover-secret.yaml
#
# Get credentials from your secrets manager (e.g. Vaultwarden, 1Password).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
type: Opaque
stringData:
  PUSHOVER_USER_KEY: REPLACE_WITH_SOPS_ENCRYPTED_VALUE
  PUSHOVER_TOKEN: REPLACE_WITH_SOPS_ENCRYPTED_VALUE
