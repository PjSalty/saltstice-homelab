---
# TLS Certificates for kube-prometheus-stack services
# These create secrets referenced by HelmRelease Ingress configs
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls-cert
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: grafana
spec:
  secretName: grafana-tls-cert
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
  dnsNames:
    - grafana.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-tls-cert
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: prometheus
spec:
  secretName: prometheus-tls-cert
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
  dnsNames:
    - prometheus.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-tls-cert
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: alertmanager
spec:
  secretName: alertmanager-tls-cert
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
  dnsNames:
    - alerts.example.com
