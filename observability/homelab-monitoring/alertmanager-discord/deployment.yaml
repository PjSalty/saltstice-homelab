---
# Alertmanager Discord Adapter
# Converts AlertManager webhooks to nicely formatted Discord embeds
# Researched: 2025-12-08
# Source: https://github.com/benjojo/alertmanager-discord
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord-critical
  namespace: monitoring
  labels:
    app: alertmanager-discord
    severity: critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-discord
      severity: critical
  template:
    metadata:
      labels:
        app: alertmanager-discord
        severity: critical
    spec:
      containers:
        - name: alertmanager-discord
          image: ${IMAGE_ALERTMANAGER_DISCORD}
          ports:
            - containerPort: 9094
              name: http
          env:
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: discord-webhooks
                  key: critical-webhook
            - name: DISCORD_USERNAME
              value: "Homelab Critical"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
