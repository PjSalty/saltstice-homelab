---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
data:
  grafana.ini: |
    [server]
    protocol = http
    http_port = 3000
    domain = grafana.example.com
    root_url = https://grafana.example.com
    serve_from_sub_path = false

    [security]
    admin_user = admin
    admin_password = $__file{/etc/secrets/password}
    disable_gravatar = false

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [auth]
    disable_login_form = false
    oauth_auto_login = false

    # Authentik OIDC SSO Configuration
    # Researched: 2025-12-03
    # Provider: grafana-sso in Authentik
    [auth.generic_oauth]
    enabled = true
    name = Authentik
    client_id = grafana-sso
    client_secret = $__file{/etc/secrets/oidc_secret}
    scopes = openid profile email groups
    auth_url = https://auth.example.com/application/o/authorize/
    token_url = https://auth.example.com/application/o/token/
    api_url = https://auth.example.com/application/o/userinfo/
    allow_sign_up = true
    # Skip TLS verification for internal CA (production should use proper CA trust)
    tls_skip_verify_insecure = true
    # Role mapping based on Authentik groups
    role_attribute_path = contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    # Allow users to assign themselves to an org
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [auth.anonymous]
    enabled = false
    org_name = Main Org.
    org_role = Viewer

    [analytics]
    reporting_enabled = false
    check_for_updates = false

    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/kubernetes-cluster.json

    [log]
    mode = console
    level = info
