# MikroTik MKTXP Dashboard - Auto-provisioned from Grafana.com
# Source: https://grafana.com/grafana/dashboards/13679-mikrotik-mktxp-exporter/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mikrotik
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
data:
  mikrotik-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "title": "MikroTik MKTXP",
      "uid": "mikrotik-mktxp",
      "tags": ["mikrotik", "mktxp", "network"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "router",
            "type": "query",
            "query": "label_values(mktxp_system_uptime, routerboard_name)",
            "refresh": 2,
            "multi": true,
            "includeAll": true
          }
        ]
      },
      "panels": [
        {
          "title": "Router Uptime",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "mktxp_system_uptime{routerboard_name=~\"$router\"}",
              "legendFormat": "{{routerboard_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 86400},
                  {"color": "green", "value": 604800}
                ]
              }
            }
          }
        },
        {
          "title": "CPU Load",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "mktxp_resource_cpu_load{routerboard_name=~\"$router\"}",
              "legendFormat": "{{routerboard_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 80}
                ]
              }
            }
          }
        },
        {
          "title": "Memory Usage",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "100 - (mktxp_resource_free_memory{routerboard_name=~\"$router\"} / mktxp_resource_total_memory{routerboard_name=~\"$router\"} * 100)",
              "legendFormat": "{{routerboard_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 85}
                ]
              }
            }
          }
        },
        {
          "title": "Interface Traffic",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "rate(mktxp_interface_rx_byte{routerboard_name=~\"$router\"}[5m]) * 8",
              "legendFormat": "{{routerboard_name}} - {{name}} RX"
            },
            {
              "expr": "rate(mktxp_interface_tx_byte{routerboard_name=~\"$router\"}[5m]) * 8",
              "legendFormat": "{{routerboard_name}} - {{name}} TX"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "title": "DHCP Leases",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "count(mktxp_dhcp_lease_info{routerboard_name=~\"$router\"})",
              "legendFormat": "Active Leases"
            }
          ]
        },
        {
          "title": "Firewall Rules",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "topk(20, mktxp_firewall_filter_bytes{routerboard_name=~\"$router\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true},
                "renameByName": {
                  "routerboard_name": "Router",
                  "chain": "Chain",
                  "comment": "Rule",
                  "Value": "Bytes"
                }
              }
            }
          ]
        },
        {
          "title": "Connection Stats",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "mktxp_connection_stats_value{routerboard_name=~\"$router\", connection_type=\"tcp\"}",
              "legendFormat": "{{routerboard_name}} TCP"
            },
            {
              "expr": "mktxp_connection_stats_value{routerboard_name=~\"$router\", connection_type=\"udp\"}",
              "legendFormat": "{{routerboard_name}} UDP"
            }
          ]
        }
      ]
    }
