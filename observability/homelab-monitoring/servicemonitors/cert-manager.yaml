---
# cert-manager ServiceMonitor
# cert-manager exposes Prometheus metrics on port 9402 via the controller service.
# Metrics include certificate expiry, issuance latency, and ACME request counts.
# Source: https://cert-manager.io/docs/observability/prometheus-metrics/
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: monitoring
  labels:
    app: cert-manager
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - cert-manager
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: tcp-prometheus-servicemonitor
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
