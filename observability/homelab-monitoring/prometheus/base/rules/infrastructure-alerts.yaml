---
# Infrastructure Self-Sustaining Alerts
# Monitors certificates, backups, disk space, and critical services
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerts
  namespace: monitoring
  labels:
    app: prometheus
    prometheus: monitoring
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    # =========================================================================
    # Certificate Expiration Alerts
    # =========================================================================
    - name: certificates
      interval: 1h
      rules:
        # cert-manager certificates expiring soon
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            category: security
          annotations:
            summary: "Certificate {{ $labels.name }} expires in less than 7 days"
            description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires soon."
            runbook_url: "https://grafana.example.com/d/cert-manager"
            action: "Check cert-manager logs and certificate renewal status"

        - alert: CertificateExpiryCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600
          for: 10m
          labels:
            severity: critical
            category: security
          annotations:
            summary: "Certificate {{ $labels.name }} expires in less than 24 hours"
            description: "CRITICAL: Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires within 24 hours. Immediate action required!"
            action: "Manually renew certificate: kubectl cert-manager renew {{ $labels.name }} -n {{ $labels.namespace }}"

        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
            category: security
          annotations:
            summary: "Certificate {{ $labels.name }} is not ready"
            description: |
              Certificate {{ $labels.name }} in namespace {{ $labels.namespace }}
              has been in a not-ready state for more than 30 minutes.
            action: "kubectl describe certificate {{ $labels.name }} -n {{ $labels.namespace }}"

    # =========================================================================
    # Disk Space Alerts
    # =========================================================================
    - name: disk-space
      interval: 5m
      rules:
        - alert: NodeDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{fstype=~"ext4|xfs|nfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|nfs"}) * 100 < 20
          for: 15m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
            description: |
              Node {{ $labels.instance }} has only {{ printf "%.1f" $value }}% disk space
              remaining on {{ $labels.mountpoint }}.
            action: "Clean up old logs, images, or expand storage"

        - alert: NodeDiskSpaceCritical
          expr: |
            (node_filesystem_avail_bytes{fstype=~"ext4|xfs|nfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|nfs"}) * 100 < 10
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Critical disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
            description: |
              CRITICAL: Node {{ $labels.instance }} has only {{ printf "%.1f" $value }}%
              disk space remaining on {{ $labels.mountpoint }}.
            action: "Immediate cleanup required or services will fail"

        - alert: PVCSpaceLow
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 15
          for: 15m
          labels:
            severity: warning
            category: storage
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is running low on space"
            description: |
              PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}
              has only {{ printf "%.1f" $value }}% space remaining.
            action: "Expand PVC or clean up data"

    # =========================================================================
    # Backup Verification Alerts
    # =========================================================================
    - name: backups
      interval: 30m
      rules:
        # Velero backup failures
        - alert: VeleroBackupFailed
          expr: |
            increase(velero_backup_failure_total[24h]) > 0
          for: 1h
          labels:
            severity: warning
            category: backup
          annotations:
            summary: "Velero backup failed in the last 24 hours"
            description: |
              {{ $value }} Velero backup(s) have failed in the last 24 hours.
              Check Velero logs for details.
            action: "velero backup logs <backup-name>"

        - alert: VeleroBackupMissing
          expr: |
            time() - velero_backup_last_successful_timestamp > 86400
          for: 1h
          labels:
            severity: warning
            category: backup
          annotations:
            summary: "No successful Velero backup in 24 hours"
            description: |
              Schedule {{ $labels.schedule }} has not had a successful backup
              in over 24 hours.
            action: "Check Velero schedule: velero schedule describe {{ $labels.schedule }}"

        # NFS storage health
        - alert: NFSExportUnavailable
          expr: |
            probe_success{job="blackbox-nfs"} == 0
          for: 5m
          labels:
            severity: critical
            category: storage
          annotations:
            summary: "NFS export unavailable"
            description: |
              NFS export {{ $labels.instance }} is not responding.
              This may affect all Kubernetes persistent volumes.
            action: "Check TrueNAS NFS service and network connectivity"

    # =========================================================================
    # Critical Service Alerts
    # =========================================================================
    - name: critical-services
      interval: 1m
      rules:
        - alert: FluxReconciliationFailing
          expr: |
            gotk_reconcile_condition{type="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
            category: gitops
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.name }} reconciliation failing"
            description: |
              Flux {{ $labels.kind }} {{ $labels.name }} in namespace {{ $labels.namespace }}
              has been failing to reconcile for more than 30 minutes.
            action: "Check Flux status: flux get all -n {{ $labels.namespace }}"

        - alert: FluxSuspended
          expr: |
            gotk_suspend_status == 1
          for: 4h
          labels:
            severity: info
            category: gitops
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.name }} is suspended"
            description: |
              Flux {{ $labels.kind }} {{ $labels.name }} has been suspended
              for more than 4 hours. GitOps is not active for this resource.
            action: "Resume resource: flux resume kustomization {{ $labels.name }} -n {{ $labels.namespace }}"

        - alert: HelmReleaseNotReady
          expr: |
            helm_release_info{status!="deployed"} == 1
          for: 30m
          labels:
            severity: warning
            category: gitops
          annotations:
            summary: "Helm release {{ $labels.name }} is not deployed"
            description: |
              Helm release {{ $labels.name }} in namespace {{ $labels.namespace }}
              has status {{ $labels.status }} instead of deployed.
            action: "helm history {{ $labels.name }} -n {{ $labels.namespace }}"

    # =========================================================================
    # Automation Health Alerts
    # =========================================================================
    - name: automation-health
      interval: 5m
      rules:
        - alert: CronJobFailed
          expr: |
            kube_job_status_failed{job_name=~".*-(trivy|license|version|vm-update).*"} > 0
          for: 10m
          labels:
            severity: warning
            category: automation
          annotations:
            summary: "Automation CronJob {{ $labels.job_name }} failed"
            description: |
              CronJob {{ $labels.job_name }} in namespace {{ $labels.namespace }}
              has failed. Automated task did not complete successfully.
            action: "kubectl logs job/{{ $labels.job_name }} -n {{ $labels.namespace }}"

        - alert: CronJobNotScheduled
          expr: |
            time() - kube_cronjob_status_last_schedule_time{cronjob=~".*(trivy|license|version).*"} > 172800
          for: 1h
          labels:
            severity: warning
            category: automation
          annotations:
            summary: "CronJob {{ $labels.cronjob }} hasn't run in 48 hours"
            description: |
              CronJob {{ $labels.cronjob }} in namespace {{ $labels.namespace }}
              has not been scheduled in over 48 hours.
            action: "kubectl get cronjob {{ $labels.cronjob }} -n {{ $labels.namespace }}"

    # =========================================================================
    # Infrastructure VM Alerts
    # =========================================================================
    - name: infrastructure-vms
      interval: 1m
      rules:
        - alert: CIRunnerNodeDown
          expr: up{job="node-exporter", instance=~"<internal-ip>.*"} == 0
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "CI Runner VM is down"
            description: "ci-runner (<internal-ip>) has been unreachable for 5 minutes. Deploy pipelines will fail."
            action: "Check Proxmox VM status and network connectivity for ci-runner"

    # =========================================================================
    # External Service Health (via node-exporter or service checks)
    # =========================================================================
    - name: external-services
      interval: 1m
      rules:
        # Detect if NFS provisioner is failing to create PVs
        - alert: NFSProvisionerFailing
          expr: |
            increase(nfs_provisioner_errors_total[1h]) > 5
          for: 15m
          labels:
            severity: warning
            category: storage
          annotations:
            summary: "NFS provisioner encountering errors"
            description: |
              NFS provisioner has encountered {{ $value }} errors in the last hour.
              New PVC creation may be failing.
            action: "Check nfs-provisioner logs in kube-system namespace"

        # Kubernetes API server health
        - alert: KubeAPIServerDown
          expr: |
            up{job="kubernetes-apiservers"} == 0
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Kubernetes API server is down"
            description: |
              Kubernetes API server is not responding.
              Cluster operations will fail.
            action: "Check kube-apiserver pods on control plane nodes"

        # etcd health
        - alert: EtcdClusterUnhealthy
          expr: |
            etcd_server_has_leader == 0
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "etcd cluster has no leader"
            description: |
              etcd cluster has lost its leader. This is a critical issue
              that will affect all Kubernetes operations.
            action: "Check etcd pods and logs on control plane nodes"

        - alert: SeedboxNodeDown
          for: 5m
          labels:
            severity: critical
          annotations:
            action: "Check VM status in Proxmox (qm status 111)"

        - alert: SeedboxDiskFull
          expr: |
          for: 10m
          labels:
            severity: warning
          annotations:
            action: "Check for files outside /mnt/downloads"

        - alert: SeedboxNFSMountDown
          for: 5m
          labels:
            severity: critical
          annotations:
            description: "The /mnt/downloads NFS mount is not responding. Downloads cannot proceed."
            action: "Check TrueNAS NFS service and network connectivity"

    # =========================================================================
    # Pod Health Alerts
    # =========================================================================
    - name: pod-health
      interval: 1m
      rules:
        # Detect pods stuck in CrashLoopBackOff
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
            category: kubernetes
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              (namespace {{ $labels.namespace }}) has restarted {{ $value | humanize }}
              times in the last hour.
            action: "kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} --previous"

        # Detect pods stuck in Pending state
        - alert: PodStuckPending
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
            category: kubernetes
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in Pending"
            description: >-
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been
              in Pending state for over 15 minutes. May indicate resource constraints
              or scheduling issues.
            action: "kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}"

    # =========================================================================
    # Node Resource Pressure Alerts
    # =========================================================================
    - name: node-resources
      interval: 1m
      rules:
        - alert: NodeHighMemoryUsage
          expr: |
            (
              node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
            ) / node_memory_MemTotal_bytes > 0.90
          for: 10m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: |
              Node {{ $labels.instance }} memory usage is {{ printf "%.1f" (mul $value 100) }}%.
              Available memory is critically low which may cause OOM kills.
            runbook_url: "https://grafana.example.com/d/node-resources"
            action: "Check memory consumers: kubectl top pods -A --sort-by=memory"

        - alert: NodeMemoryCritical
          expr: |
            (
              node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
            ) / node_memory_MemTotal_bytes > 0.95
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Critical memory pressure on {{ $labels.instance }}"
            description: |
              Node {{ $labels.instance }} memory usage is {{ printf "%.1f" (mul $value 100) }}%.
              OOM kills are imminent. Immediate action required.
            action: "kubectl describe node {{ $labels.instance }} | grep -A5 Conditions"

        - alert: NodeHighCPUUsage
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 15m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: |
              Node {{ $labels.instance }} CPU usage has been above 90% for 15 minutes.
              Current usage: {{ printf "%.1f" $value }}%.
            runbook_url: "https://grafana.example.com/d/node-resources"
            action: "kubectl top pods -A --sort-by=cpu to identify CPU consumers"

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 5m
          labels:
            severity: critical
            category: kubernetes
          annotations:
            summary: "Kubernetes node {{ $labels.node }} is NotReady"
            description: |
              Node {{ $labels.node }} has been in NotReady state for over 5 minutes.
              Pods on this node may be evicted or unschedulable.
            action: "kubectl describe node {{ $labels.node }} and check kubelet logs"

        - alert: NodeDiskPressure
          expr: |
            kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Disk pressure on Kubernetes node {{ $labels.node }}"
            description: |
              Node {{ $labels.node }} is reporting DiskPressure condition.
              The kubelet may evict pods to reclaim disk space.
            action: "kubectl describe node {{ $labels.node }} to check disk usage"

        - alert: NodeMemoryPressure
          expr: |
            kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Memory pressure on Kubernetes node {{ $labels.node }}"
            description: |
              Node {{ $labels.node }} is reporting MemoryPressure condition.
              The kubelet is actively evicting pods to reclaim memory.
            action: "kubectl describe node {{ $labels.node }} and check OOM events"
