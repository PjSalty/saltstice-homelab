---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Optional: Add Authentik authentication
    # traefik.ingress.kubernetes.io/router.middlewares: authentik-forwardauth-prometheus@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - metrics.example.com
      secretName: prometheus-tls-cert
  rules:
    - host: metrics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
