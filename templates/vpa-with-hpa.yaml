# VPA + HPA on the same Deployment. VPA must be memory-only when paired
# with HPA on CPU, otherwise they fight for control of CPU requests.
# Pattern: HPA scales replicas on CPU, VPA right-sizes memory.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: <APP-NAME>
  namespace: <APP-NAMESPACE>
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: <APP-NAME>
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600 # conservative — avoid flapping
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
    scaleUp:
      stabilizationWindowSeconds: 120 # responsive to spikes
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: <APP-NAME>
  namespace: <APP-NAMESPACE>
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: <APP-NAME>
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: <CONTAINER-NAME>
        # Memory only — HPA owns CPU. Without this, VPA bumps CPU
        # requests and HPA's utilization math goes sideways.
        controlledResources: ["memory"]
        minAllowed:
          memory: 256Mi
        maxAllowed:
          memory: 4Gi
