# Per-namespace SecretStore + ExternalSecret pulling from a shared
# decrypted-by-Flux Secret in another namespace. Pattern: SOPS-encrypted
# values live in the secrets repo, Flux decrypts into a single namespace,
# ESO propagates to per-app namespaces with no cross-namespace mount.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cluster-secrets
  namespace: <APP-NAMESPACE>
spec:
  provider:
    kubernetes:
      remoteNamespace: shared
      auth:
        serviceAccount:
          name: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: <SECRET-NAME>
  namespace: <APP-NAMESPACE>
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: cluster-secrets
  target:
    name: <SECRET-NAME>
    creationPolicy: Owner # or Merge — see notes
  data:
    - secretKey: <KEY-IN-RESULTING-SECRET>
      remoteRef:
        key: <SOURCE-SECRET-NAME>
        property: <KEY-IN-SOURCE-SECRET>
# creationPolicy notes:
#   Owner: ESO creates and owns the target Secret.
#   Merge: ESO merges into an existing Secret. Target MUST already exist.
#   Forgot the latter? You'll see the ExternalSecret stuck "SecretSyncedError".
