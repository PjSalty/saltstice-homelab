# =============================================================================
# Canonical SOPS-encrypted Kubernetes Secret
# =============================================================================
#
# This is a structural reference for how secrets are stored in the private
# repo and decrypted by FluxCD on reconciliation. It exists in this public
# mirror to document the pattern; the real ciphertext, recipients, and MAC
# do not.
#
# In production:
#   - Files are encrypted via `sops -e -i secret.yaml` against the homelab age
#     recipient set (see .sops.yaml in the private secrets repo).
#   - The Flux Kustomization that consumes the file specifies a decryption
#     provider with a SecretRef pointing at the `sops-age` Secret in
#     flux-system, which contains the cluster's age private key.
#   - kustomize-controller decrypts in-memory at apply time. The plaintext
#     never lands on disk inside the cluster.
#
# Key rules (see also: .claude/rules/security.md in the private repo):
#   - Encrypt VALUES only. Keys MUST remain plaintext or decryption breaks.
#   - encrypted_regex pins which keys to encrypt; everything else is metadata.
#   - One age recipient per cluster identity. Rotate by re-encrypting.
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
    name: example-app-secret
    namespace: example
type: Opaque
stringData:
    api-key: ENC[AES256_GCM,data:<encrypted-bytes>,iv:<iv>,tag:<tag>,type:str]
    database-url: ENC[AES256_GCM,data:<encrypted-bytes>,iv:<iv>,tag:<tag>,type:str]
sops:
    age:
        - recipient: age1example0000000000000000000000000000000000000000000000000000
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            <base64-encoded-ciphertext-of-the-data-key-encrypted-to-the-recipient>
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-01-01T00:00:00Z"
    mac: ENC[AES256_GCM,data:<mac>,iv:<iv>,tag:<tag>,type:str]
    encrypted_regex: ^(data|stringData|password|token|key|secret|apiKey|apiToken|credentials|certificate|private|privateKey)$
    version: 3.10.2
