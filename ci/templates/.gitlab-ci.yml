    - docker tag "${HARBOR_REGISTRY}/tools/ansible-runner:${CI_COMMIT_SHORT_SHA}" "${HARBOR_REGISTRY}/tools/ansible-runner:stable"
    - docker push "${HARBOR_REGISTRY}/tools/ansible-runner:stable"
    - echo "Promoted ansible-runner:${CI_COMMIT_SHORT_SHA} → :stable"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - images/ansible-runner/**/*
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN != "true"

promote:media-drop-watcher:
  stage: deploy
  image: ${HARBOR_REGISTRY}/dockerhub-proxy/library/docker:29
