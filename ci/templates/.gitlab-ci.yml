# =============================================================================
# Promote images: SHA → stable (only after scan + test pass)
# =============================================================================
promote:homelab-tooling:
  stage: deploy
  image: ${HARBOR_REGISTRY}/dockerhub-proxy/library/docker:29
  services:
    - name: ${HARBOR_REGISTRY}/dockerhub-proxy/library/docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: scan:homelab-tooling
    - job: test:homelab-tooling
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_REGISTRY} -u "${HARBOR_USERNAME}" --password-stdin
  script:
    - docker pull "${HARBOR_REGISTRY}/tools/homelab-tooling:${CI_COMMIT_SHORT_SHA}"
    - docker tag "${HARBOR_REGISTRY}/tools/homelab-tooling:${CI_COMMIT_SHORT_SHA}" "${HARBOR_REGISTRY}/tools/homelab-tooling:stable"
    - docker push "${HARBOR_REGISTRY}/tools/homelab-tooling:stable"
    - echo "Promoted homelab-tooling:${CI_COMMIT_SHORT_SHA} → :stable"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - images/homelab-tooling/**/*
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN != "true"

