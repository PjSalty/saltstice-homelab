# =============================================================================
# Pipeline failure notification
# =============================================================================
notify:failure:
  extends: .notify:ntfy

# Sync shared configs to all repos when pre-commit or yamllint changes
sync:configs:
  extends: .sync:config
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - .pre-commit-config.yaml
        - .yamllint

# =============================================================================
# Renovate Bot - Scans all infrastructure repos for dependency updates
# =============================================================================
# Schedule: Every 6 hours (set via GitLab pipeline schedule)
# Trigger variable: RENOVATE_RUN=true
#
# Auto-merges patch/minor updates across all repos.
# Major versions create MRs requiring manual review.
#
renovate:scan:
  extends: .renovate:multi-repo
  stage: renovate
  needs: []
  variables:
    LOG_LEVEL: info
    RENOVATE_DRY_RUN: "false"
  rules:
    # Scheduled or API-triggered with RENOVATE_RUN
    - if: $RENOVATE_RUN == "true"
    # Manual trigger
    - when: manual
      allow_failure: true

# Dry-run scan to preview updates without creating MRs
renovate:preview:
  extends: .renovate:multi-repo
  stage: renovate
  needs: []
  variables:
    LOG_LEVEL: info
    RENOVATE_DRY_RUN: "full"
  rules:
    - when: manual
      allow_failure: true
